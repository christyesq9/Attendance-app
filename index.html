<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Noto Sans JP", sans-serif;
  background: #f5f5f5;
  color: #333;
}

button {

  border-radius: 10px;
  padding: 12px 16px;

  cursor: pointer;
}

button:active {

}

.container {

.card {

h1, h2, h3 {

}

.center {

}

.hidden {

}

.primary {

}

.green {

}

.red {

  color: white;
}

.orange {
  background: #e58b00;
  color: white;
}

.blue {

  color: white;
}

.gray {

.small {

.staff-grid {

.manager-tabs button {

input,

label {

table {

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://yxlcnyxuziukptvtmgub.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4p3StZjP4BQA_NE7b9oMDQ_N2DeHvn5";


/* =====================================================
   SETTINGS
===================================================== */

const DEFAULT_MANAGER_PIN =
  "1234";

const MANAGER_PIN_KEY =
  "sugarTreeManagerPin";


/* =====================================================
   STATE
===================================================== */

let employees = [];

let managerSelectedDate = "";

let historyMonth = "";


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
  table,
  method = "GET",
  query = "",
  body = null
) {

  const url =
    `${SUPABASE_URL}/rest/v1/${table}${query}`;

  const options = {

    method,

    headers: {

      "apikey": SUPABASE_KEY,

      "Authorization":
        "Bearer " + SUPABASE_KEY,

      "Content-Type":
        "application/json",

      "Prefer":
        "return=representation"

    }

  };

  if (body !== null) {
    options.body =
      JSON.stringify(body);
  }

  const response =
    await fetch(url, options);

  const text =
    await response.text();

  if (!response.ok) {

    console.error(
      "Supabase error:",
      response.status,
      text
    );

    throw new Error(
      text ||
      `HTTP ${response.status}`
    );
  }

  if (!text) {
    return [];
  }

  try {

    return JSON.parse(text);

  } catch {

    return [];

  }

}


/* =====================================================
   JAPAN DATE
===================================================== */

function getJapanDate() {

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    ).formatToParts(new Date());

  const obj = {};

  parts.forEach(p => {

    if (p.type !== "literal") {
      obj[p.type] = p.value;
    }

  });

  return `${obj.year}-${obj.month}-${obj.day}`;

}


function getJapanMonth() {

  return getJapanDate()
    .substring(0, 7);

}


function formatDateTimeForInput(
  iso
) {

  if (!iso) return "";

  const date =
    new Date(iso);

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    ).formatToParts(date);

  const obj = {};

  parts.forEach(p => {

    if (p.type !== "literal") {
      obj[p.type] = p.value;
    }

  });

  return `${obj.year}-${obj.month}-${obj.day}T${obj.hour}:${obj.minute}`;

}


function localDateTimeToISO(
  value
) {

  if (!value) return null;

  return new Date(value)
    .toISOString();

}


/* =====================================================
   LIVE CLOCK
===================================================== */

function updateClock() {

  const timeEl =
    document.getElementById(
      "currentTime"
    );

  const dateEl =
    document.getElementById(
      "currentDate"
    );

  if (!timeEl || !dateEl) {
    return;
  }

  const time =
    new Intl.DateTimeFormat(
      "ja-JP",
      {
        timeZone: "Asia/Tokyo",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      }
    ).format(new Date());

  const date =
    new Intl.DateTimeFormat(
      "ja-JP",
      {
        timeZone: "Asia/Tokyo",
        year: "numeric",
        month: "long",
        day: "numeric",
        weekday: "long"
      }
    ).format(new Date());

  timeEl.textContent =
    time;

  dateEl.textContent =
    date;

}

setInterval(
  updateClock,
  1000
);

updateClock();


/* =====================================================
   INITIAL LOAD
===================================================== */

window.addEventListener(
  "load",
  async () => {

    managerSelectedDate =
      getJapanDate();

    document.getElementById(
      "managerDate"
    ).value =
      managerSelectedDate;

    document.getElementById(
      "payrollMonth"
    ).value =
      getJapanMonth();

    await loadEmployees();

  }
);


/* =====================================================
   EMPLOYEES
===================================================== */

async function loadEmployees() {

  try {

    employees =
      await supabaseRequest(
        "employees",
        "GET",
        "?select=*&order=name.asc"
      );

    renderStaffGrid();

  } catch (error) {

    console.error(error);

    document.getElementById(
      "staffGrid"
    ).innerHTML =
      `
      <div class="danger-notice">
        スタッフ情報を読み込めませんでした。
      </div>
      `;

  }

}


function getActiveEmployees() {

  return employees.filter(
    employee =>
      employee.active !== false
  );

}


function getEmployee(
  employeeId
) {

  return employees.find(
    e =>
      String(e.id) ===
      String(employeeId)
  );

}


/* =====================================================
   STAFF HOME
===================================================== */

function renderStaffGrid() {

  const grid =
    document.getElementById(
      "staffGrid"
    );

  const activeEmployees =
    getActiveEmployees();

  if (!activeEmployees.length) {

    grid.innerHTML =
      `
      <div class="notice">
        現在、登録されているスタッフがありません。
      </div>
      `;

    return;

  }

  grid.innerHTML =
    activeEmployees
      .map(employee => {

        return `
          <button
            class="staff-button"
            onclick="selectStaff(${employee.id})"
          >
            👤 ${escapeHTML(employee.name)}
          </button>
        `;

      })
      .join("");

}


async function selectStaff(
  employeeId
) {

  const employee =
    getEmployee(employeeId);

  if (!employee) return;

  const today =
    getJapanDate();

  try {

    const records =
      await getAttendanceForEmployeeDate(
        employeeId,
        today
      );

    const record =
      choosePrimaryAttendanceRecord(
        records
      );

    if (
      record &&
      record.clock_in &&
      !record.clock_out
    ) {

      const elapsed =
        new Date() -
        new Date(record.clock_in);

      const hours =
        Math.floor(
          elapsed / 3600000
        );

      const minutes =
        Math.floor(
          (elapsed % 3600000) /
          60000
        );

      const seconds =
        Math.floor(
          (elapsed % 60000) /
          1000
        );

      const answer =
        confirm(
          `${employee.name}さん\n\n` +
          `現在、出勤中です。\n` +
          `実働時間：約 ${hours}時間 ${minutes}分 ${seconds}秒\n\n` +
          `退勤しますか？`
        );

      if (answer) {

        await clockOut(
          employeeId,
          record
        );

      }

      return;

    }

    if (
      record &&
      record.clock_in &&
      record.clock_out
    ) {

      alert(
        `${employee.name}さんは本日すでに退勤済みです。\n\n` +
        `出勤：${formatTime(record.clock_in)}\n` +
        `退勤：${formatTime(record.clock_out)}`
      );

      return;

    }

    const answer =
      confirm(
        `${employee.name}さん\n\n出勤しますか？`
      );

    if (answer) {

      await clockIn(
        employeeId
      );

    }

  } catch (error) {

    console.error(error);

    alert(
      "出退勤処理中にエラーが発生しました。"
    );

  }

}


/* =====================================================
   ONE SHIFT PER DAY
===================================================== */

async function getAttendanceForEmployeeDate(
  employeeId,
  workDate
) {

  return await supabaseRequest(
    "attendance",
    "GET",
    `?select=*&employee_id=eq.${encodeURIComponent(employeeId)}` +
    `&work_date=eq.${encodeURIComponent(workDate)}` +
    `&order=clock_in.desc`
  );

}


function choosePrimaryAttendanceRecord(
  records
) {

  if (
    !records ||
    !records.length
  ) {
    return null;
  }

  return [...records].sort(
    (a, b) => {

      const aTime =
        a.clock_in
          ? new Date(
              a.clock_in
            ).getTime()
          : 0;

      const bTime =
        b.clock_in
          ? new Date(
              b.clock_in
            ).getTime()
          : 0;

      if (
        bTime !== aTime
      ) {
        return bTime - aTime;
      }

      return String(b.id)
        .localeCompare(
          String(a.id)
        );

    }
  )[0];

}


function dedupeAttendanceRecords(
  records
) {

  const map =
    new Map();

  records.forEach(record => {

    const key =
      `${record.employee_id}__${record.work_date}`;

    if (!map.has(key)) {

      map.set(
        key,
        record
      );

    } else {

      map.set(
        key,
        choosePrimaryAttendanceRecord([
          map.get(key),
          record
        ])
      );

    }

  });

  return Array.from(
    map.values()
  );

}

===================================================== */

async function clockIn(
  employeeId
) {

  const today =
    getJapanDate();

  const records =
    await getAttendanceForEmployeeDate(
      employeeId,
      today
    );

  const existing =
    choosePrimaryAttendanceRecord(
      records
    );

  if (existing) {

    if (
      existing.clock_in &&
      !existing.clock_out
    ) {

      alert(
        "すでに出勤しています。"
      );

      return;

    }

    await supabaseRequest(
      "attendance",
      "PATCH",
      `?id=eq.${existing.id}`,
      {
        clock_in:
          new Date().toISOString(),

        clock_out:
          null,

        break_minutes:
          0
      }
    );

    alert("出勤しました。");

    return;

  }

  await supabaseRequest(
    "attendance",
    "POST",
    "",
    {
      employee_id:
        employeeId,

      work_date:
        today,

      clock_in:
        new Date().toISOString(),

      clock_out:
        null,

      break_minutes:
        0
    }
  );

  alert("出勤しました。");

}


/* =====================================================
   CLOCK OUT
===================================================== */

async function clockOut(
  employeeId,
  record
) {

  if (!record) {

    alert(
      "勤務データが見つかりません。"
    );

    return;

  }

  const breakInput =
    prompt(
      "休憩時間を入力してください（分）",
      record.break_minutes || 0
    );

  if (breakInput === null) {
    return;
  }

  const breakMinutes =
    Number(breakInput);

  if (
    isNaN(breakMinutes) ||
    breakMinutes < 0
  ) {

    alert(
      "休憩時間を正しく入力してください。"
    );

    return;

  }

  await supabaseRequest(
    "attendance",
    "PATCH",
    `?id=eq.${record.id}`,
    {
      clock_out:
        new Date().toISOString(),

      break_minutes:
        breakMinutes
    }
  );

  alert("退勤しました。");

}

        `&order=clock_in.asc`
      );

    const uniqueRecords =
      dedupeAttendanceRecords(
        records

    const recordMap =
      new Map();

    uniqueRecords.forEach(

            if (

              times =

              times =

              workTime =
                calculateWorkMinutes(

/* =====================================================
   WORK TIME
===================================================== */

function calculateCurrentWorkTime(
  record
) {

  if (!record.clock_in) {
    return "";
  }

  const start =
    new Date(record.clock_in);

  const end =
    record.clock_out
      ? new Date(record.clock_out)
      : new Date();

  let minutes =
    Math.floor(
      (end - start) /
      60000
    );

  minutes -=
    Number(
      record.break_minutes || 0
    );

  if (minutes < 0) {
    minutes = 0;
  }

  return formatMinutes(
    minutes
  );

}


function calculateWorkMinutes(
  record
) {

  if (
    !record.clock_in ||
    !record.clock_out
  ) {
    return "";
  }

  return formatMinutes(
    getWorkMinutes(record)
  );

}


function getWorkMinutes(
  record
) {

  if (
    !record.clock_in ||
    !record.clock_out
  ) {
    return 0;
  }

  let minutes =
    Math.floor(
      (
        new Date(record.clock_out) -
        new Date(record.clock_in)
      ) /
      60000
    );

  minutes -=
    Number(
      record.break_minutes || 0
    );

  return Math.max(
    0,
    minutes
  );

}


function formatMinutes(
  minutes
) {

  const hours =
    Math.floor(
      minutes / 60
    );

  const mins =
    minutes % 60;

  return `${hours}時間${mins}分`;

}


function formatTime(
  iso
) {

  if (!iso) return "";

  return new Intl.DateTimeFormat(
    "ja-JP",
    {
      timeZone: "Asia/Tokyo",
      hour: "2-digit",
      minute: "2-digit"
    }
  ).format(
    new Date(iso)
  );

}

async function saveEdit() {

  const id =
    document.getElementById(
      "editAttendanceId"
    ).value;

  const employeeId =
    document.getElementById(
      "editAttendanceEmployee"
    ).value;

  const workDate =
    document.getElementById(
      "editAttendanceDate"
    ).value;

  const clockIn =
    document.getElementById(
      "editClockIn"
    ).value;

  const clockOut =
    document.getElementById(
      "editClockOut"
    ).value;

  const breakMinutes =
    Number(
      document.getElementById(
        "editBreakMinutes"
      ).value || 0
    );

  if (
    !employeeId ||
    !workDate
  ) {

    alert(
      "スタッフと日付を入力してください。"
    );

    return;

  }

  if (
    breakMinutes < 0
  ) {

    alert(
      "休憩時間を正しく入力してください。"
    );

    return;

  }

  const body = {

    employee_id:
      Number(employeeId),

    work_date:
      workDate,

    clock_in:
      localDateTimeToISO(clockIn),

    clock_out:
      localDateTimeToISO(clockOut),

    break_minutes:
      breakMinutes

  };

  try {

    if (id) {

      const existing =
        await getAttendanceForEmployeeDate(
          employeeId,
          workDate
        );

      const duplicate =
        existing.find(
          record =>
            String(record.id) !==
            String(id)
        );

      if (duplicate) {

        const confirmed =
          confirm(
            "このスタッフのこの日には、すでに別の勤務データがあります。\n\n" +
            "既存データを上書きして、このデータを統合しますか？"
          );

        if (!confirmed) {
          return;
        }

        await supabaseRequest(
          "attendance",
          "PATCH",
          `?id=eq.${duplicate.id}`,
          {
            clock_in:
              body.clock_in,

            clock_out:
              body.clock_out,

            break_minutes:
              body.break_minutes
          }
        );

        await supabaseRequest(
          "attendance",
          "DELETE",
          `?id=eq.${id}`
        );

      } else {

        await supabaseRequest(
          "attendance",
          "PATCH",
          `?id=eq.${id}`,
          body
        );

      }

    } else {

      const existing =
        await getAttendanceForEmployeeDate(
          employeeId,
          workDate
        );

      const primary =
        choosePrimaryAttendanceRecord(
          existing
        );

      if (primary) {

        await supabaseRequest(
          "attendance",
          "PATCH",
          `?id=eq.${primary.id}`,
          {
            clock_in:
              body.clock_in,

            clock_out:
              body.clock_out,

            break_minutes:
              body.break_minutes
          }
        );

      } else {

        await supabaseRequest(
          "attendance",
          "POST",
          "",
          body
        );

      }

    }

    closeModal(
      "editAttendanceModal"
    );

    await loadDailyAttendance();

    if (
      !document.getElementById(
        "historyModal"
      ).classList.contains("hidden")
    ) {

      await loadStaffHistory();

    }

    alert("保存しました。");

  } catch (error) {

    console.error(error);

    alert(
      "保存できませんでした。\n\n" +
      error.message
    );

  }

}


/* =====================================================
   ★ FIXED DELETE
===================================================== */

async function deleteAttendance(
  attendanceId,
  fromHistory = false
) {

  try {

    /*
      First get the selected record.
    */

    const selectedRows =
      await supabaseRequest(
        "attendance",
        "GET",
        `?select=*&id=eq.${encodeURIComponent(
          attendanceId
        )}`
      );

    if (!selectedRows.length) {

      alert(
        "この勤務データはすでに削除されています。"
      );

      if (fromHistory) {
        await loadStaffHistory();
      } else {
        await loadDailyAttendance();
      }

      return;

    }

    const selected =
      selectedRows[0];

    const employee =
      getEmployee(
        selected.employee_id
      );

    const employeeName =
      employee
        ? employee.name
        : "スタッフ";


    /*
      Check if there are old duplicate records
      for the same staff/date.
    */

    const sameDayRecords =
      await getAttendanceForEmployeeDate(
        selected.employee_id,
        selected.work_date
      );


    const message =
      sameDayRecords.length > 1

        ? `${employeeName}さん\n` +
          `${selected.work_date} の勤務データを削除しますか？\n\n` +
          `この日は ${sameDayRecords.length}件の重複データがあります。\n` +
          `🗑 削除すると、この日の勤務データをすべて削除します。\n\n` +
          `この操作は元に戻せません。`

        : `${employeeName}さん\n` +
          `${selected.work_date} の勤務データを削除しますか？\n\n` +
          `出勤：${
            formatTime(selected.clock_in) ||
            "未入力"
          }\n` +
          `退勤：${
            formatTime(selected.clock_out) ||
            "未入力"
          }\n` +
          `休憩：${
            selected.break_minutes || 0
          }分\n\n` +
          `この操作は元に戻せません。`;


    const confirmed =
      confirm(message);

    if (!confirmed) {
      return;
    }


    /*
      ★ IMPORTANT:
      Delete ALL records for that staff/date.

      This also cleans up old duplicate records.
    */

    await supabaseRequest(
      "attendance",
      "DELETE",
      `?employee_id=eq.${encodeURIComponent(
        selected.employee_id
      )}` +
      `&work_date=eq.${encodeURIComponent(
        selected.work_date
      )}`
    );


    /*
      ★ VERIFY THE DELETE
      This is the important fix.

      We ask Supabase again whether the records
      still exist.
    */

    const remaining =
      await getAttendanceForEmployeeDate(
        selected.employee_id,
        selected.work_date
      );


    if (remaining.length > 0) {

      /*
        DELETE did not actually remove the rows.
      */

      console.error(
        "Delete verification failed:",
        remaining
      );

      alert(
        "⚠️ 勤務データを削除できませんでした。\n\n" +
        "SupabaseのRLS（DELETE権限）が有効になっていない可能性があります。\n\n" +
        "Supabase SQL Editorで、下記のDELETEポリシーを追加してください。"
      );

      return;

    }


    /*
      ★ SUCCESS
    */

    alert(
      `${selected.work_date} の勤務データを削除しました。`
    );


    /*
      ★ RELOAD THE CURRENT PAGE
      so the deleted record disappears immediately.
    */

    if (fromHistory) {

      await loadStaffHistory();

    } else {

      await loadDailyAttendance();

    }

  } catch (error) {

    console.error(
      "Delete error:",
      error
    );

    alert(
      "勤務データを削除できませんでした。\n\n" +
      error.message
    );

  }

}

async function saveBulkEntry() {

  const date =
    managerSelectedDate ||
    getJapanDate();

  const rows =
    document.querySelectorAll(
      "[data-bulk-employee]"
    );

  try {

    for (
      const row of rows
    ) {

      const employeeId =
        row.dataset.bulkEmployee;

      const recordId =
        row.dataset.recordId;

      const clockIn =
        row.querySelector(
          ".bulk-clock-in"
        ).value;

      const clockOut =
        row.querySelector(
          ".bulk-clock-out"
        ).value;

      const breakMinutes =
        Number(
          row.querySelector(
            ".bulk-break"
          ).value || 0
        );

      if (
        !clockIn &&
        !clockOut
      ) {
        continue;
      }

      const existing =
        await getAttendanceForEmployeeDate(
          employeeId,
          date
        );

      const primary =
        choosePrimaryAttendanceRecord(
          existing
        );

      const body = {

        employee_id:
          Number(employeeId),

        work_date:
          date,

        clock_in:
          localDateTimeToISO(
            clockIn
          ),

        clock_out:
          localDateTimeToISO(
            clockOut
          ),

        break_minutes:
          breakMinutes

      };

      if (primary) {

        await supabaseRequest(
          "attendance",
          "PATCH",
          `?id=eq.${primary.id}`,
          {
            clock_in:
              body.clock_in,

            clock_out:
              body.clock_out,

            break_minutes:
              body.break_minutes
          }
        );

      } else {

        await supabaseRequest(
          "attendance",
          "POST",
          "",
          body
        );

      }

    }

    closeModal(
      "bulkEntryModal"
    );

    await loadDailyAttendance();

    alert(
      "一括保存しました。"
    );

  } catch (error) {

    console.error(error);

    alert(
      "一括保存中にエラーが発生しました。"
    );

  }

}

async function addStaff() {

      await supabaseRequest(
        "employees",

function changeHistoryMonth(
  direction
) {

  if (!historyMonth) {

    historyMonth =
      getJapanMonth();

  }

  const parts =
    historyMonth.split("-");

  let year =
    Number(parts[0]);

  let month =
    Number(parts[1]);

  month += direction;

  if (month > 12) {

    month = 1;
    year++;

  }

  if (month < 1) {

    month = 12;
    year--;

  }

  historyMonth =
    `${year}-${String(month).padStart(2,"0")}`;

  document.getElementById(
    "historyMonth"
  ).value =
    historyMonth;

  loadStaffHistory();

}

async function loadStaffHistory() {

  const employeeId =
    document.getElementById(
      "historyEmployeeId"
    ).value;

  if (!employeeId) return;

  const month =
    historyMonth ||
    getJapanMonth();

  const startDate =
    `${month}-01`;

  const endDate =
    getNextMonth(month) +
    "-01";

  const container =
    document.getElementById(
      "staffHistoryList"
    );

  container.innerHTML =
    "読み込み中...";

  try {

    const records =
      await supabaseRequest(
        "attendance",
        "GET",
        `?select=*&employee_id=eq.${encodeURIComponent(
          employeeId
        )}` +
        `&work_date=gte.${encodeURIComponent(
          startDate
        )}` +
        `&work_date=lt.${encodeURIComponent(
          endDate
        )}` +
        `&order=work_date.desc,clock_in.desc`
      );

    /*
      Existing duplicates are reduced to
      ONE record per day.
    */

    const uniqueRecords =
      dedupeAttendanceRecords(
        records
      );

    uniqueRecords.sort(
      (a,b) =>
        String(b.work_date)
          .localeCompare(
            String(a.work_date)
          )
    );

    let totalMinutes = 0;
    let completedDays = 0;
    let incompleteDays = 0;
    let totalPay = 0;

    const employee =
      getEmployee(
        employeeId
      );

    const hourlyRate =
      Number(
        employee?.hourly_rate || 0
      );

    uniqueRecords.forEach(
      record => {

        if (
          record.clock_in &&
          record.clock_out
        ) {

          const minutes =
            getWorkMinutes(
              record
            );

          totalMinutes +=
            minutes;

          completedDays++;

          totalPay +=
            (minutes / 60) *
            hourlyRate;

        } else {

          incompleteDays++;

        }

      }
    );

    document.getElementById(
      "historySummary"
    ).innerHTML = `

      <div class="summary-grid">

        <div class="summary-box">
          <div class="summary-label">
            完了勤務日数
          </div>

          <div class="summary-value">
            ${completedDays}日
          </div>
        </div>

        <div class="summary-box">
          <div class="summary-label">
            実働時間
          </div>

          <div class="summary-value">
            ${formatMinutes(
              totalMinutes
            )}
          </div>
        </div>

        <div class="summary-box">
          <div class="summary-label">
            概算給与
          </div>

          <div class="summary-value">
            ¥${Math.round(
              totalPay
            ).toLocaleString()}
          </div>
        </div>

        <div class="summary-box">
          <div class="summary-label">
            未完了
          </div>

          <div class="summary-value">
            ${incompleteDays}日
          </div>
        </div>

      </div>

      ${
        incompleteDays
          ? `
            <div class="notice">
              ⚠ 未完了の勤務データは給与計算から除外されます。
            </div>
          `
          : ""
      }

    `;

    if (
      !uniqueRecords.length
    ) {

      container.innerHTML =
        `
        <div class="notice">
          この月の勤務データはありません。
        </div>
        `;

      return;

    }


    /*
      ★ IMPORTANT:
      Each date has exactly one displayed card.
    */

    container.innerHTML =
      uniqueRecords
        .map(record => {

          const completed =
            record.clock_in &&
            record.clock_out;

          const minutes =
            completed
              ? getWorkMinutes(record)
              : 0;

          const pay =
            completed
              ? (
                  minutes / 60
                ) *
                hourlyRate
              : 0;

          return `

            <div class="shift-row">

              <div class="shift-date">
                📅 ${record.work_date}
              </div>

              <div class="shift-details">

                ${
                  record.clock_in
                    ? `出勤：
                       ${formatTime(
                         record.clock_in
                       )}`
                    : "出勤：未入力"
                }

                <br>

                ${
                  record.clock_out
                    ? `退勤：
                       ${formatTime(
                         record.clock_out
                       )}`
                    : "退勤：未入力"
                }

                <br>

                休憩：
                ${record.break_minutes || 0}分

                <br>

                ${
                  completed
                    ? `
                      実働：
                      ${formatMinutes(
                        minutes
                      )}

                      <br>

                      概算給与：
                      ¥${Math.round(
                        pay
                      ).toLocaleString()}
                    `
                    : `
                      <span class="status-working">
                        ⚠ 未完了
                      </span>
                    `
                }

              </div>


              <div
                class="action-buttons"
                style="margin-top:12px;"
              >

                <button
                  class="blue"
                  onclick="openEditAttendanceById('${record.id}')"
                >
                  ✏️ 編集
                </button>

                <button
                  class="red"
                  onclick="deleteAttendance('${record.id}', true)"
                >
                  🗑 削除
                </button>

                <button
                  class="orange"
                  onclick="resetAttendanceFromHistory('${record.id}')"
                >
                  0時間にリセット
                </button>

              </div>

            </div>

          `;

        })
        .join("");

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `
      <div class="danger-notice">
        勤務履歴を読み込めませんでした。
      </div>
      `;

  }

}

function downloadCSV(
  rows,
  filename
) {

  const csv =
    rows.map(
      row =>
        row.map(
          value =>
            `"${String(
              value ?? ""
            ).replace(
              /"/g,
              '""'
            )}"`
        ).join(",")
    ).join("\r\n");

  const blob =
    new Blob(
      ["\ufeff" + csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );

  const url =
    URL.createObjectURL(blob);

  const a =
    document.createElement("a");

  a.href = url;
  a.download = filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);

}

function getNextMonth(
  month
) {

  const [
    year,
    monthNumber
  ] =
    month.split("-")
      .map(Number);

  let nextYear =
    year;

  let nextMonth =
    monthNumber + 1;

  if (
    nextMonth > 12
  ) {

    nextMonth = 1;
    nextYear++;

  }

  return `${nextYear}-${String(
    nextMonth
  ).padStart(2,"0")}`;

}


/* =====================================================
   MODALS
===================================================== */

function openModal(
  id
) {

  document.getElementById(
    id
  ).classList.remove(
    "hidden"
  );

}


function closeModal(
  id
) {

  document.getElementById(
    id
  ).classList.add(
    "hidden"
  );

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(
  value
) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}


/* =====================================================
   CLOSE MODAL BY OUTSIDE CLICK
===================================================== */

document.querySelectorAll(
  ".modal"
).forEach(
  modal => {

    modal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          modal
        ) {

          modal.classList.add(
            "hidden"
          );

        }

      }
    );

  }
);

</script>
