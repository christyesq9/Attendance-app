<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出退勤管理</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                   "Yu Gothic", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      margin: 15px 0 30px;
      font-size: 30px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .employees {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .employee {
      background: white;
      border: none;
      border-radius: 16px;
      padding: 25px 10px;
      font-size: 21px;
      font-weight: bold;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .employee:active {
      transform: scale(.97);
    }

    .selected-name {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin: 20px 0 25px;
    }

    .button {
      width: 100%;
      border: none;
      border-radius: 16px;
      padding: 22px;
      margin-bottom: 15px;
      font-size: 24px;
      font-weight: bold;
      color: white;
    }

    .clock-in {
      background: #28a745;
    }

    .clock-out {
      background: #dc3545;
    }

    .back {
      background: #777;
      font-size: 18px;
      padding: 15px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 25px;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .message {
      text-align: center;
      padding: 15px;
      margin-top: 15px;
      border-radius: 10px;
      background: #eee;
    }

    .hidden {
      display: none;
    }

    input {
      width: 100%;
      padding: 18px;
      font-size: 22px;
      border: 1px solid #ccc;
      border-radius: 12px;
      margin: 10px 0 20px;
      text-align: center;
    }

    .confirm {
      background: #333;
      color: white;
      border: none;
      width: 100%;
      padding: 18px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <!-- NAME SCREEN -->
  <div id="nameScreen">

    <h1>出退勤管理</h1>

    <div class="subtitle">
      名前を選択してください
    </div>

    <div id="employees" class="employees">
      読み込み中...
    </div>

  </div>


  <!-- CLOCK SCREEN -->
  <div id="clockScreen" class="hidden">

    <h1>出退勤</h1>

    <div id="selectedName" class="selected-name"></div>

    <div class="card">

      <button
        class="button clock-in"
        onclick="clockIn()">
        🟢 出勤
      </button>

      <button
        class="button clock-out"
        onclick="showBreakForm()">
        🔴 退勤
      </button>

      <button
        class="button back"
        onclick="goBack()">
        ← 名前を変更
      </button>

    </div>

    <div id="statusMessage" class="message hidden"></div>

  </div>


  <!-- BREAK SCREEN -->

  <div id="breakScreen" class="hidden">

    <h1>退勤</h1>

    <div class="card">

      <div class="selected-name" id="breakEmployeeName"></div>

      <p style="text-align:center;">
        今日の休憩時間を入力してください
      </p>

      <input
        id="breakMinutes"
        type="number"
        min="0"
        placeholder="例：60">

      <p style="text-align:center;">
        分
      </p>

      <button
        class="confirm"
        onclick="clockOut()">
        退勤する
      </button>

      <button
        class="button back"
        style="margin-top:15px;"
        onclick="cancelBreak()">
        戻る
      </button>

    </div>

  </div>

</div>


<script>

  // =========================
  // SUPABASE
  // =========================

  const SUPABASE_URL =
    "https://yxlcnyxuziukptvtmgub.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_4p3StZjP4BQA_NE7b9oMDQ_N2DeHvn5;

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  let selectedEmployee = null;
  let todayAttendance = null;


  // =========================
  // LOAD EMPLOYEES
  // =========================

  async function loadEmployees() {

    const { data, error } =
      await supabaseClient
        .from("employees")
        .select("*")
        .eq("active", true)
        .order("id");

    if (error) {
      console.error(error);

      document.getElementById("employees").innerHTML =
        "<p>従業員情報を読み込めませんでした。</p>";

      return;
    }

    const container =
      document.getElementById("employees");

    container.innerHTML = "";

    data.forEach(employee => {

      const button =
        document.createElement("button");

      button.className = "employee";

      button.textContent = employee.name;

      button.onclick =
        () => selectEmployee(employee);

      container.appendChild(button);

    });

  }


  // =========================
  // SELECT EMPLOYEE
  // =========================

  async function selectEmployee(employee) {

    selectedEmployee = employee;

    document.getElementById("nameScreen")
      .classList.add("hidden");

    document.getElementById("clockScreen")
      .classList.remove("hidden");

    document.getElementById("selectedName")
      .textContent =
        employee.name + "さん";

    await checkTodayAttendance();

  }


  // =========================
  // CHECK TODAY
  // =========================

  async function checkTodayAttendance() {

    const today =
      new Date().toISOString().split("T")[0];

    const { data, error } =
      await supabaseClient
        .from("attendance")
        .select("*")
        .eq("employee_id", selectedEmployee.id)
        .eq("work_date", today)
        .order("id", { ascending: false })
        .limit(1);

    if (error) {
      console.error(error);
      return;
    }

    todayAttendance =
      data && data.length > 0
        ? data[0]
        : null;

  }


  // =========================
  // CLOCK IN
  // =========================

  async function clockIn() {

    if (todayAttendance &&
        todayAttendance.clock_in &&
        !todayAttendance.clock_out) {

      showMessage("すでに出勤しています。");

      return;
    }

    const now =
      new Date().toISOString();

    const today =
      new Date().toISOString().split("T")[0];

    const { data, error } =
      await supabaseClient
        .from("attendance")
        .insert({
          employee_id: selectedEmployee.id,
          work_date: today,
          clock_in: now,
          break_minutes: 0
        })
        .select()
        .single();

    if (error) {

      console.error(error);

      showMessage(
        "出勤登録に失敗しました。"
      );

      return;
    }

    todayAttendance = data;

    showMessage(
      "🟢 " +
      selectedEmployee.name +
      "さんの出勤を登録しました！"
    );

  }


  // =========================
  // SHOW BREAK FORM
  // =========================

  function showBreakForm() {

    if (!todayAttendance ||
        !todayAttendance.clock_in) {

      showMessage(
        "先に「出勤」を登録してください。"
      );

      return;
    }

    if (todayAttendance.clock_out) {

      showMessage(
        "今日はすでに退勤しています。"
      );

      return;
    }

    document.getElementById("clockScreen")
      .classList.add("hidden");

    document.getElementById("breakScreen")
      .classList.remove("hidden");

    document.getElementById("breakEmployeeName")
      .textContent =
        selectedEmployee.name + "さん";

    document.getElementById("breakMinutes")
      .value = "";

  }


  // =========================
  // CLOCK OUT
  // =========================

  async function clockOut() {

    const breakMinutes =
      parseInt(
        document.getElementById("breakMinutes").value
      );

    if (isNaN(breakMinutes) ||
        breakMinutes < 0) {

      alert("休憩時間を入力してください。");

      return;
    }

    const now =
      new Date().toISOString();

    const { data, error } =
      await supabaseClient
        .from("attendance")
        .update({
          clock_out: now,
          break_minutes: breakMinutes
        })
        .eq("id", todayAttendance.id)
        .select()
        .single();

    if (error) {

      console.error(error);

      alert(
        "退勤登録に失敗しました。"
      );

      return;
    }

    todayAttendance = data;

    document.getElementById("breakScreen")
      .classList.add("hidden");

    document.getElementById("clockScreen")
      .classList.remove("hidden");

    showMessage(
      "🔴 " +
      selectedEmployee.name +
      "さんの退勤を登録しました！"
    );

  }


  // =========================
  // BACK
  // =========================

  function goBack() {

    selectedEmployee = null;
    todayAttendance = null;

    document.getElementById("clockScreen")
      .classList.add("hidden");

    document.getElementById("nameScreen")
      .classList.remove("hidden");

    document.getElementById("statusMessage")
      .classList.add("hidden");

  }


  function cancelBreak() {

    document.getElementById("breakScreen")
      .classList.add("hidden");

    document.getElementById("clockScreen")
      .classList.remove("hidden");

  }


  function showMessage(message) {

    const element =
      document.getElementById("statusMessage");

    element.textContent = message;

    element.classList.remove("hidden");

    setTimeout(() => {

      element.classList.add("hidden");

    }, 4000);

  }


  // Start app
  loadEmployees();

</script>

</body>
</html>
