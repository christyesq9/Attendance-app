<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sugar Tree Okinawa - 出退勤管理</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Hiragino Kaku Gothic ProN",
    "Yu Gothic",
    Meiryo,
    sans-serif;
  background: #f5f5f5;
  color: #222;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

.hidden {
  display: none !important;
}

/* =========================
   HEADER
========================= */

.header {
  background: #222;
  color: white;
  padding: 18px 15px;
  text-align: center;
}

.header h1 {
  margin: 0;
  font-size: 22px;
}

.header p {
  margin: 5px 0 0;
  font-size: 13px;
  opacity: .8;
}

/* =========================
   CONTAINER
========================= */

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px 15px 60px;
}

/* =========================
   CARDS
========================= */

.card {
  background: white;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 15px;
  box-shadow: 0 2px 10px rgba(0,0,0,.07);
}

.card h2,
.card h3 {
  margin-top: 0;
}

/* =========================
   CLOCK
========================= */

.clock {
  text-align: center;
  font-size: 28px;
  font-weight: bold;
}

.date-display {
  text-align: center;
  color: #666;
  margin-top: 5px;
}

/* =========================
   BUTTONS
========================= */

.btn {
  border: none;
  border-radius: 10px;
  padding: 12px 16px;
  margin: 4px;
  background: #333;
  color: white;
  font-weight: bold;
  min-height: 44px;
}

.btn:hover {
  opacity: .9;
}

.btn-primary {
  background: #222;
}

.btn-success {
  background: #198754;
}

.btn-danger {
  background: #dc3545;
}

.btn-warning {
  background: #f0ad4e;
  color: #111;
}

.btn-secondary {
  background: #777;
}

.btn-light {
  background: #eee;
  color: #222;
}

.btn-small {
  padding: 8px 10px;
  font-size: 13px;
  min-height: 38px;
}

/* =========================
   STAFF BUTTONS
========================= */

.staff-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px;
}

.staff-select-btn {
  padding: 16px 10px;
  border: 1px solid #ddd;
  background: white;
  border-radius: 12px;
  font-weight: bold;
  min-height: 60px;
}

.staff-select-btn:hover {
  background: #f0f0f0;
}

/* =========================
   FORM
========================= */

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  margin-bottom: 6px;
  font-weight: bold;
}

input,
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 8px;
  background: white;
}

/* =========================
   MANAGER NAV
========================= */

.manager-nav {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  margin-bottom: 15px;
}

.manager-nav button {
  flex: 1;
  min-width: 130px;
  padding: 12px 8px;
  border: none;
  background: #ddd;
  border-radius: 8px;
  font-weight: bold;
}

.manager-nav button.active {
  background: #222;
  color: white;
}

/* =========================
   DATE CONTROLS
========================= */

.date-controls {
  display: flex;
  align-items: center;
  gap: 8px;
}

.date-controls button {
  flex: 0 0 auto;
}

.date-controls input {
  flex: 1;
}

/* =========================
   TABLE
========================= */

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  background: white;
}

th,
td {
  padding: 10px 8px;
  border-bottom: 1px solid #eee;
  text-align: left;
  vertical-align: middle;
}

th {
  background: #f1f1f1;
  white-space: nowrap;
}

td {
  font-size: 14px;
}

/* =========================
   STATUS
========================= */

.status-working {
  color: #198754;
  font-weight: bold;
}

.status-finished {
  color: #555;
}

.status-incomplete {
  color: #dc3545;
  font-weight: bold;
}

.work-time {
  font-weight: bold;
}

/* =========================
   STAFF MANAGEMENT
========================= */

.employee-card {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 10px;
  background: white;
}

.employee-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

.employee-name {
  font-weight: bold;
  font-size: 18px;
}

.employee-meta {
  color: #666;
  font-size: 13px;
  margin: 5px 0 10px;
}

.employee-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

/* =========================
   MODAL
========================= */

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.55);
  z-index: 9999;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 15px;

  pointer-events: auto;
}

.modal-overlay.hidden {
  display: none !important;
  pointer-events: none !important;
}

.modal {
  background: white;
  width: 100%;
  max-width: 800px;
  max-height: 90vh;
  overflow-y: auto;
  border-radius: 15px;
  padding: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,.3);
}

.modal-small {
  max-width: 500px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.modal-header h2 {
  margin: 0;
  font-size: 20px;
}

.close-btn {
  border: none;
  background: #eee;
  border-radius: 50%;
  width: 40px;
  height: 40px;
  font-size: 20px;
}

/* =========================
   HISTORY
========================= */

.history-summary {
  background: #f5f5f5;
  border-radius: 10px;
  padding: 12px;
  margin-bottom: 15px;
}

.history-summary-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
}

.summary-box {
  background: white;
  border-radius: 8px;
  padding: 10px;
  text-align: center;
}

.summary-label {
  font-size: 12px;
  color: #666;
}

.summary-value {
  font-size: 18px;
  font-weight: bold;
  margin-top: 3px;
}

/* =========================
   BULK ENTRY
========================= */

.bulk-row {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr .8fr;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}

.bulk-row .name {

}

@media(max-width:650px) {
  .bulk-row {

    background: #f7f7f7;
    padding: 10px;

  }

    margin-top: 4px;
  }

/* =========================
   HOME
========================= */

.home-buttons {
  display: grid;
  grid-template-columns: 1fr;
  gap: 12px;
  max-width: 500px;
  margin: 25px auto;
}

.home-buttons .btn {

/* =========================
   NOTICE
========================= */

.notice {

  background: #fff8e1;

  margin-bottom: 15px;
  color: #6b5200;
}

.empty {

  color: #777;
  padding: 30px 10px;
}

/* =========================
   BODY MODAL STATE
========================= */

body.modal-open {
  overflow: hidden;
}
</style>
</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://yxlcnyxuziukptvtmgub.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4p3StZjP4BQA_NE7b9oMDQ_N2DeHvn5";

const JAPAN_TZ = "Asia/Tokyo";

const DEFAULT_MANAGER_PIN = "1234";

const MANAGER_PIN_STORAGE_KEY =
  "sugarTreeManagerPin";


/* =========================================================
   STATE
========================================================= */

let employees = [];

let attendanceRecords = [];

let selectedEmployeeId = null;

let managerSelectedDate = "";

let historyEmployeeId = null;

let historyMonth = "";

let currentManagerTab = "daily";

let liveTimer = null;


/* =========================================================
   SUPABASE REQUEST
========================================================= */

async function supabaseRequest(
  table,
  method = "GET",
  query = "",
  body = null,
  extraHeaders = {}
) {

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${table}${query}`,
    {
      method,
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=representation",
        ...extraHeaders
      },
      body: body
        ? JSON.stringify(body)
        : undefined
    }
  );

  const text = await response.text();

  let data = [];

  if (text) {

    try {
      data = JSON.parse(text);
    } catch {
      data = text;
    }

  }

  if (!response.ok) {

    const message =
      data?.message ||
      data?.hint ||
      data?.details ||
      `Supabase error ${response.status}`;

    throw new Error(message);
  }

  return data;
}


/* =========================================================
   DATE / TIME
========================================================= */

function getJapanDate() {

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: JAPAN_TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }
    ).formatToParts(new Date());

  const map =
    Object.fromEntries(
      parts.map(p => [p.type, p.value])
    );

  return `${map.year}-${map.month}-${map.day}`;
}


function getJapanMonth() {

  return getJapanDate().slice(0, 7);

}


function formatJapanDate(dateString) {

  if (!dateString) return "";

  const [y,m,d] =
    dateString.split("-");

  return `${y}/${m}/${d}`;

}


function formatDateTimeJapan(iso) {

  if (!iso) return "-";

  const d = new Date(iso);

  return new Intl.DateTimeFormat(
    "ja-JP",
    {
      timeZone: JAPAN_TZ,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    }
  ).format(d);

}


function localDateTimeToISO(value) {

  if (!value) return null;

  return new Date(value).toISOString();

}


function isoToLocalInput(iso) {

  if (!iso) return "";

  const d = new Date(iso);

  const parts =
    new Intl.DateTimeFormat(
      "en-CA",
      {
        timeZone: JAPAN_TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      }
    ).formatToParts(d);

  const map =
    Object.fromEntries(
      parts.map(p => [p.type, p.value])
    );

  let hour = map.hour;

  if (hour === "24") {
    hour = "00";
  }

  return `${map.year}-${map.month}-${map.day}T${hour}:${map.minute}`;
}


/* =========================================================
   TIME CALCULATIONS
========================================================= */

function calculateWorkMinutes(record) {

  if (!record || !record.clock_in || !record.clock_out) {
    return null;
  }

  const start =
    new Date(record.clock_in);

  const end =
    new Date(record.clock_out);

  let minutes =
    Math.floor(
      (end - start) / 60000
    );

  minutes -=
    Number(record.break_minutes || 0);

  return Math.max(0, minutes);

}


function formatMinutes(minutes) {

  if (minutes === null || minutes === undefined) {
    return "-";
  }

  const h =
    Math.floor(minutes / 60);

  const m =
    minutes % 60;

  return `${h}時間${String(m).padStart(2,"0")}分`;

}


function formatLiveDuration(iso) {

  if (!iso) return "00:00:00";

  const start =
    new Date(iso);

  const now =
    new Date();

  let seconds =
    Math.floor(
      (now - start) / 1000
    );

  seconds =
    Math.max(0, seconds);

  const h =
    Math.floor(seconds / 3600);

  const m =
    Math.floor((seconds % 3600) / 60);

  const s =
    seconds % 60;

  return (
    String(h).padStart(2,"0") +
    ":" +
    String(m).padStart(2,"0") +
    ":" +
    String(s).padStart(2,"0")
  );
}


/* =========================================================
   ATTENDANCE DEDUPE
========================================================= */

function choosePrimaryAttendanceRecord(records) {

  if (!records || !records.length) {
    return null;
  }

  return records
    .slice()
    .sort((a,b) => {

      const aHas =
        a.clock_in ? 1 : 0;

      const bHas =
        b.clock_in ? 1 : 0;

      if (bHas !== aHas) {
        return bHas - aHas;
      }

      return String(
        b.clock_in || ""
      ).localeCompare(
        String(a.clock_in || "")
      );

    })[0];
}


function dedupeAttendanceRecords(records) {

  const map = new Map();

  for (const record of records || []) {

    const key =
      `${record.employee_id}__${record.work_date}`;

    const existing =
      map.get(key);

    if (!existing) {

      map.set(key, record);

    } else {

      map.set(
        key,
        choosePrimaryAttendanceRecord([
          existing,
          record
        ])
      );

    }

  }

  return Array.from(map.values());

}

========================================================= */

function nextEmployeeCode() {

  const numbers =
    employees
      .map(e => {

        const match =
          String(e.employee_code || "")
            .match(/EMP(\d+)/);

        return match
          ? Number(match[1])
          : 0;

      })
      .filter(n => n > 0);

  const next =
    numbers.length
      ? Math.max(...numbers) + 1
      : 1;

  return (
    "EMP" +
    String(next).padStart(3,"0")
  );

}

/* =========================================================
   ATTENDANCE STATUS
========================================================= */

async function refreshSelectedEmployeeStatus() {

  if (!selectedEmployeeId) return;

  const record =
    await getPrimaryAttendance(
      selectedEmployeeId,
      getJapanDate()
    );

  const status =
    document.getElementById(
      "attendanceStatus"
    );

  const live =
    document.getElementById(
      "liveWorkingTime"
    );

  const clockInButton =
    document.getElementById(
      "clockInButton"
    );

  const clockOutButton =
    document.getElementById(
      "clockOutButton"
    );

  if (!record) {

    status.textContent =
      "本日はまだ出勤していません。";

    live.textContent =
      "00:00:00";

    clockInButton.disabled = false;

    clockOutButton.disabled = true;

    if (liveTimer) {

      clearInterval(liveTimer);

      liveTimer = null;

    }

    return;
  }


  if (record.clock_in && !record.clock_out) {

    status.innerHTML =
      `<span class="status-working">
        🟢 出勤中
      </span><br>
      出勤：
      ${formatDateTimeJapan(record.clock_in)}`;

    clockInButton.disabled = true;

    clockOutButton.disabled = false;

    if (liveTimer) {
      clearInterval(liveTimer);
    }

    liveTimer =
      setInterval(() => {

        live.textContent =
          formatLiveDuration(
            record.clock_in
          );

      }, 1000);

    live.textContent =
      formatLiveDuration(
        record.clock_in
      );

    return;
  }


  if (record.clock_in && record.clock_out) {

    status.innerHTML =
      `<span class="status-finished">
        🔵 本日の勤務終了
      </span><br>
      出勤：
      ${formatDateTimeJapan(record.clock_in)}
      <br>
      退勤：
      ${formatDateTimeJapan(record.clock_out)}
      <br>
      休憩：
      ${record.break_minutes || 0}分
      <br>
      実働：
      <strong>
        ${formatMinutes(
          calculateWorkMinutes(record)
        )}
      </strong>`;

    live.textContent =
      formatMinutes(
        calculateWorkMinutes(record)
      );

    clockInButton.disabled = true;

    clockOutButton.disabled = true;

    if (liveTimer) {

      clearInterval(liveTimer);

      liveTimer = null;

    }

  }

}


/* =========================================================
   CLOCK IN
========================================================= */

async function clockInSelected() {

  if (!selectedEmployeeId) return;

  const today =
    getJapanDate();

  try {

    const existing =
      await getAttendanceForEmployeeDate(
        selectedEmployeeId,
        today
      );

    const primary =
      choosePrimaryAttendanceRecord(
        existing
      );

    if (primary && primary.clock_in) {

      alert("すでに出勤しています。");

      await refreshSelectedEmployeeStatus();

      return;
    }

    const now =
      new Date().toISOString();

    if (primary) {

      await supabaseRequest(
        "attendance",
        "PATCH",
        `?id=eq.${encodeURIComponent(primary.id)}`,
        {
          clock_in: now,
          clock_out: null,
          break_minutes:
            Number(primary.break_minutes || 0)
        }
      );

    } else {

      await supabaseRequest(
        "attendance",
        "POST",
        "",
        {
          employee_id:
            selectedEmployeeId,
          work_date:
            today,
          clock_in:
            now,
          clock_out:
            null,
          break_minutes:
            0
        }
      );

    }

    alert("出勤しました。");

    await refreshSelectedEmployeeStatus();

  } catch (error) {

    console.error(error);

    alert(
      "出勤登録に失敗しました。\n" +
      error.message
    );

  }

}


/* =========================================================
   CLOCK OUT
========================================================= */

async function clockOutSelected() {

  if (!selectedEmployeeId) return;

  const today =
    getJapanDate();

  try {

    const record =
      await getPrimaryAttendance(
        selectedEmployeeId,
        today
      );

    if (!record || !record.clock_in) {

      alert("出勤記録がありません。");

      return;
    }

    if (record.clock_out) {

      alert("すでに退勤しています。");

      return;
    }

    const breakInput =
      prompt(
        "休憩時間を入力してください（分）",
        String(record.break_minutes || 0)
      );

    if (breakInput === null) {
      return;
    }

    const breakMinutes =
      Number(breakInput);

    if (
      !Number.isFinite(breakMinutes) ||
      breakMinutes < 0
    ) {

      alert("休憩時間は0以上の数字で入力してください。");

      return;
    }

    await supabaseRequest(
      "attendance",
      "PATCH",
      `?id=eq.${encodeURIComponent(record.id)}`,
      {
        clock_out:
          new Date().toISOString(),
        break_minutes:
          Math.floor(breakMinutes)
      }
    );

    alert("退勤しました。");

    await refreshSelectedEmployeeStatus();

  } catch (error) {

    console.error(error);

    alert(
      "退勤登録に失敗しました。\n" +
      error.message
    );

  }

}

  if (breakMinutes < 0) {

    alert("休憩時間は0以上にしてください。");

    return;
  }

  if (clockOut && !clockIn) {

    alert(
      "退勤時間だけを入力することはできません。"
    );

    return;
  }


  try {

    /*
      同じスタッフ・同じ日に
      別レコードが存在しないか確認
    */

    const duplicates =
      await getAttendanceForEmployeeDate(
        employeeId,
        workDate
      );

    const conflicting =
      duplicates.find(
        r =>
          String(r.id) !==
          String(recordId)
      );

    if (conflicting) {

      alert(
        "このスタッフには同じ日の勤務データがすでにあります。"
      );

      return;
    }


    const data = {

      employee_id:
        employeeId,

      work_date:
        workDate,

      clock_in:
        localDateTimeToISO(clockIn),

      clock_out:
        localDateTimeToISO(clockOut),

      break_minutes:
        Math.floor(breakMinutes)

    };


    if (recordId) {

      await supabaseRequest(
        "attendance",
        "PATCH",
        `?id=eq.${encodeURIComponent(recordId)}`,
        data
      );

    } else {

      await supabaseRequest(
        "attendance",
        "POST",
        "",
        data
      );

    }


    alert("勤務データを保存しました。");

    closeModal(
      "editAttendanceModal"
    );

    await loadDailyAttendance();

    if (historyEmployeeId) {

      await loadStaffHistory();

    }

  } catch (error) {

    console.error(error);

    alert(
      "保存に失敗しました。\n" +
      error.message
    );

  }

}

/* =========================================================
   DELETE BY EMPLOYEE + DATE
========================================================= */

async function deleteAttendanceByEmployeeDate(
  employeeId,
  workDate
) {

  const employee =
    employees.find(
      e =>
        String(e.id) ===
        String(employeeId)
    );

  const name =
    employee
      ? employee.name
      : "このスタッフ";


  if (
    !confirm(
      `${name}さんの ${workDate} の勤務データを削除します。\n\nこの操作は元に戻せません。\n\nよろしいですか？`
    )
  ) {
    return;
  }


  try {

    const before =
      await getAttendanceForEmployeeDate(
        employeeId,
        workDate
      );

    if (!before.length) {

      alert(
        "削除対象が見つかりません。"
      );

      return;
    }


    await supabaseRequest(
      "attendance",
      "DELETE",
      `?employee_id=eq.${encodeURIComponent(employeeId)}&work_date=eq.${encodeURIComponent(workDate)}`
    );


    const after =
      await getAttendanceForEmployeeDate(
        employeeId,
        workDate
      );


    if (after.length > 0) {

      throw new Error(
        "削除できませんでした。SupabaseのDELETE権限（RLS）を確認してください。"
      );

    }


    alert(
      "勤務データを削除しました。"
    );


    closeModal(
      "editAttendanceModal"
    );

    await loadDailyAttendance();

    if (historyEmployeeId) {

      await loadStaffHistory();

    }

  } catch (error) {

    console.error(error);

    alert(
      "削除に失敗しました。\n" +
      error.message
    );

  }

}

/* =========================================================
   HISTORY MONTH
========================================================= */

function setHistoryMonth(value) {

  if (!value) return;

  historyMonth =
    value;

  loadStaffHistory();

}


function changeHistoryMonth(
  direction
) {

  if (!historyMonth) {

    historyMonth =
      getJapanMonth();

  }

  const [
    year,
    monthNumber
  ] =
    historyMonth
      .split("-")
      .map(Number);

  let y = year;

  let m =
    monthNumber +
    direction;

  if (m > 12) {

    m = 1;

    y++;

  }

  if (m < 1) {

    m = 12;

    y--;

  }

  historyMonth =
    `${y}-${String(m).padStart(2,"0")}`;

  document
    .getElementById("historyMonth")
    .value =
    historyMonth;

  loadStaffHistory();

}


/* =========================================================
   LOAD HISTORY
========================================================= */

async function loadStaffHistory() {

  if (!historyEmployeeId) return;

  const container =
    document.getElementById(
      "staffHistoryList"
    );

  const summary =
    document.getElementById(
      "historySummary"
    );

  container.innerHTML =
    "読み込み中...";


  try {

    const nextMonth =
      getNextMonth(
        historyMonth
      );


    const records =
      await supabaseRequest(
        "attendance",
        "GET",
        `?select=*&employee_id=eq.${encodeURIComponent(historyEmployeeId)}&work_date=gte.${encodeURIComponent(historyMonth + "-01")}&work_date=lt.${encodeURIComponent(nextMonth + "-01")}&order=work_date.asc`
      );


    const uniqueRecords =
      dedupeAttendanceRecords(
        records
      );


    let totalMinutes = 0;

    let totalPay = 0;

    let completedDays = 0;

    let incompleteDays = 0;


    const employee =
      employees.find(
        e =>
          String(e.id) ===
          String(historyEmployeeId)
      );

    const hourlyRate =
      Number(
        employee?.hourly_rate || 0
      );


    uniqueRecords.forEach(record => {

      const minutes =
        calculateWorkMinutes(
          record
        );

      if (
        record.clock_in &&
        record.clock_out
      ) {

        totalMinutes +=
          minutes || 0;

        completedDays++;

        totalPay +=
          (minutes || 0) /
          60 *
          hourlyRate;

      } else if (
        record.clock_in
      ) {

        incompleteDays++;

      }

    });


    summary.innerHTML = `

      <div class="history-summary">

        <div class="history-summary-grid">

          <div class="summary-box">

            <div class="summary-label">
              完了日数
            </div>

            <div class="summary-value">
              ${completedDays}日
            </div>

          </div>

          <div class="summary-box">

            <div class="summary-label">
              実働時間
            </div>

            <div class="summary-value">
              ${formatMinutes(totalMinutes)}
            </div>

          </div>

          <div class="summary-box">

            <div class="summary-label">
              概算給与
            </div>

            <div class="summary-value">
              ¥${Math.round(totalPay).toLocaleString()}
            </div>

          </div>

        </div>

        ${
          incompleteDays > 0
            ? `
              <div class="notice" style="margin-top:10px;margin-bottom:0">
                ⚠️ 未完了勤務：
                ${incompleteDays}日
                <br>
                未完了の勤務は給与計算から除外されます。
              </div>
            `
            : ""
        }

      </div>

    `;


    if (!uniqueRecords.length) {

      container.innerHTML =
        `<div class="empty">
          この月の勤務データはありません。
        </div>`;

      return;
    }


    const rows =
      uniqueRecords.map(record => {

        const minutes =
          calculateWorkMinutes(
            record
          );

        const pay =
          minutes !== null
            ? Math.round(
                minutes /
                60 *
                hourlyRate
              )
            : 0;


        const incomplete =
          !record.clock_in ||
          !record.clock_out;


        return `

          <tr>

            <td>
              ${formatJapanDate(
                record.work_date
              )}
            </td>

            <td>
              ${formatDateTimeJapan(
                record.clock_in
              )}
            </td>

            <td>
              ${formatDateTimeJapan(
                record.clock_out
              )}
            </td>

            <td>
              ${record.break_minutes || 0}分
            </td>

            <td class="${incomplete ? "status-incomplete" : ""}">
              ${
                incomplete
                  ? "未完了"
                  : formatMinutes(minutes)
              }
            </td>

            <td>
              ${
                incomplete
                  ? "-"
                  : "¥" +
                    pay.toLocaleString()
              }
            </td>

            <td>

              <button
                type="button"
                class="btn btn-small btn-primary"
                onclick="openHistoryEdit('${record.id}')">
                編集
              </button>

              <button
                type="button"
                class="btn btn-small btn-danger"
                onclick="deleteHistoryShift('${record.employee_id}','${record.work_date}')">
                削除
              </button>

            </td>

          </tr>

        `;

      }).join("");


    container.innerHTML = `

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>日付</th>
              <th>出勤</th>
              <th>退勤</th>
              <th>休憩</th>
              <th>実働</th>
              <th>概算給与</th>
              <th>操作</th>

            </tr>

          </thead>

          <tbody>
            ${rows}
          </tbody>

        </table>

      </div>

    `;

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="notice">
        読み込みエラー：${escapeHtml(error.message)}
      </div>`;

  }

}

/* =========================================================
   SAVE BULK ENTRY
========================================================= */

async function saveBulkEntry() {

  const activeEmployees =
    employees.filter(
      e => e.active !== false
    );


  try {

    for (const employee of activeEmployees) {

      const id =
        employee.id;

      const clockIn =
        document.querySelector(
          `[data-bulk-id="${id}"][data-field="in"]`
        )?.value || "";

      const clockOut =
        document.querySelector(
          `[data-bulk-id="${id}"][data-field="out"]`
        )?.value || "";

      const breakMinutes =
        Number(
          document.querySelector(
            `[data-bulk-id="${id}"][data-field="break"]`
          )?.value || 0
        );

      const recordId =
        document.querySelector(
          `[data-bulk-id="${id}"][data-field="recordId"]`
        )?.value || "";


      if (
        !clockIn &&
        !clockOut &&
        breakMinutes === 0
      ) {

        continue;

      }


      if (clockOut && !clockIn) {

        throw new Error(
          `${employee.name}さん：退勤時間だけ入力されています。`
        );

      }


      const data = {

        employee_id:
          id,

        work_date:
          managerSelectedDate,

        clock_in:
          localDateTimeToISO(
            clockIn
          ),

        clock_out:
          localDateTimeToISO(
            clockOut
          ),

        break_minutes:
          Math.floor(
            breakMinutes
          )

      };


      if (recordId) {

        await supabaseRequest(
          "attendance",
          "PATCH",
          `?id=eq.${encodeURIComponent(recordId)}`,
          data
        );

      } else {

        const existing =
          await getAttendanceForEmployeeDate(
            id,
            managerSelectedDate
          );

        const primary =
          choosePrimaryAttendanceRecord(
            existing
          );

        if (primary) {

          await supabaseRequest(
            "attendance",
            "PATCH",
            `?id=eq.${encodeURIComponent(primary.id)}`,
            data
          );

        } else {

          await supabaseRequest(
            "attendance",
            "POST",
            "",
            data
          );

        }

      }

    }


    alert(
      "勤務データを保存しました。"
    );

    closeModal(
      "bulkEntryModal"
    );

    await loadDailyAttendance();

  } catch (error) {

    console.error(error);

    alert(
      "一括保存に失敗しました。\n" +
      error.message
    );

  }

}

            totalMinutes +=
              minutes;

            completedDays++;

          } else if (
            record.clock_in
          ) {

            incompleteDays++;

          }

        });


        const rate =
          Number(
            employee.hourly_rate || 0
          );


        const salary =
          totalMinutes /
          60 *
          rate;


        totalPayroll +=
          salary;


        return `

          <tr>

            <td>
              ${escapeHtml(
                employee.name
              )}
              ${
                employee.active === false
                  ? " (無効)"
                  : ""
              }
            </td>

            <td>
              ${completedDays}日
            </td>

            <td>
              ${formatMinutes(
                totalMinutes
              )}
            </td>

            <td>
              ¥${rate.toLocaleString()}
            </td>

            <td>
              ¥${Math.round(
                salary
              ).toLocaleString()}
            </td>

            <td>
              ${
                incompleteDays > 0
                  ? `
                    <span class="status-incomplete">
                      ${incompleteDays}日
                    </span>
                  `
                  : "-"
              }
            </td>

          </tr>

        `;

      }).join("");


    container.innerHTML = `

      <div class="notice">

        💡 表示金額は
        <strong>概算給与</strong>
        です。
        税金・社会保険等は含まれていません。

      </div>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>

              <th>スタッフ</th>
              <th>勤務日数</th>
              <th>実働時間</th>
              <th>時給</th>
              <th>概算給与</th>
              <th>未完了</th>

            </tr>

          </thead>

          <tbody>

            ${rows}

          </tbody>

        </table>

      </div>

      <div
        class="card"
        style="margin-top:15px;text-align:right">

        <strong>
          月間給与合計：
          ¥${Math.round(
            totalPayroll
          ).toLocaleString()}
        </strong>

      </div>

    `;

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="notice">
        給与計算エラー：${escapeHtml(error.message)}
      </div>`;

  }

}


/* =========================================================
   NEXT MONTH
========================================================= */

function getNextMonth(month) {

  const [
    year,
    monthNumber
  ] =
    month.split("-")
      .map(Number);

  let nextYear =
    year;

  let nextMonth =
    monthNumber + 1;

  if (nextMonth > 12) {

    nextMonth = 1;

    nextYear++;

  }

  return (
    `${nextYear}-${String(nextMonth).padStart(2,"0")}`
  );

}


/* =========================================================
   DAILY CSV
========================================================= */

async function downloadDailyCSV() {

  try {

    const records =
      await supabaseRequest(
        "attendance",
        "GET",
        `?select=*&work_date=eq.${encodeURIComponent(managerSelectedDate)}`
      );


    const uniqueRecords =
      dedupeAttendanceRecords(
        records
      );


    const rows = [

      [
        "日付",
        "スタッフ名",
        "出勤",
        "退勤",
        "休憩（分）",
        "実働時間",
        "時給",
        "概算給与"
      ]

    ];


    uniqueRecords.forEach(record => {

      const employee =
        employees.find(
          e =>
            String(e.id) ===
            String(record.employee_id)
        );

      if (!employee) return;


      const minutes =
        calculateWorkMinutes(
          record
        );


      const rate =
        Number(
          employee.hourly_rate || 0
        );


      const pay =
        minutes !== null
          ? Math.round(
              minutes /
              60 *
              rate
            )
          : "";


      rows.push([

        managerSelectedDate,

        employee.name,

        formatDateTimeJapan(
          record.clock_in
        ),

        formatDateTimeJapan(
          record.clock_out
        ),

        record.break_minutes || 0,

        minutes !== null
          ? formatMinutes(minutes)
          : "",

        rate,

        pay

      ]);

    });


    downloadCSV(
      rows,
      `SugarTree_勤務表_${managerSelectedDate}.csv`
    );

  } catch (error) {

    alert(
      "CSV出力に失敗しました。\n" +
      error.message
    );

  }

}


/* =========================================================
   MONTHLY CSV
========================================================= */

async function downloadMonthlyCSV() {

  const month =
    document
      .getElementById("payrollMonth")
      .value ||
    getJapanMonth();


  try {

    const nextMonth =
      getNextMonth(month);


    const records =
      await supabaseRequest(
        "attendance",
        "GET",
        `?select=*&work_date=gte.${encodeURIComponent(month + "-01")}&work_date=lt.${encodeURIComponent(nextMonth + "-01")}`
      );


    const uniqueRecords =
      dedupeAttendanceRecords(
        records
      );


    const rows = [

      [
        "スタッフ名",
        "勤務日数",
        "実働時間",
        "時給",
        "概算給与",
        "未完了日数"
      ]

    ];


    employees.forEach(employee => {

      const employeeRecords =
        uniqueRecords.filter(
          r =>
            String(r.employee_id) ===
            String(employee.id)
        );


      let minutes = 0;

      let days = 0;

      let incomplete = 0;


      employeeRecords.forEach(record => {

        if (
          record.clock_in &&
          record.clock_out
        ) {

          minutes +=
            calculateWorkMinutes(record) || 0;

          days++;

        } else if (
          record.clock_in
        ) {

          incomplete++;

        }

      });


      const rate =
        Number(
          employee.hourly_rate || 0
        );


      const pay =
        Math.round(
          minutes /
          60 *
          rate
        );


      rows.push([

        employee.name,

        days,

        formatMinutes(minutes),

        rate,

        pay,

        incomplete

      ]);

    });


    downloadCSV(
      rows,
      `SugarTree_給与計算_${month}.csv`
    );

  } catch (error) {

    alert(
      "CSV出力に失敗しました。\n" +
      error.message
    );

  }

}


/* =========================================================
   CSV DOWNLOAD
========================================================= */

function downloadCSV(
  rows,
  filename
) {

  const csv =
    rows
      .map(row =>
        row
          .map(value =>
            csvEscape(value)
          )
          .join(",")
      )
      .join("\r\n");


  const bom =
    "\uFEFF";


  const blob =
    new Blob(
      [bom + csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(
      blob
    );


  const a =
    document.createElement("a");

  a.href =
    url;

  a.download =
    filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(
    url
  );

}


function csvEscape(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  const text =
    String(value);

  if (
    text.includes(",") ||
    text.includes('"') ||
    text.includes("\n")
  ) {

    return (
      '"' +
      text.replaceAll('"','""') +
      '"'
    );

  }

  return text;

}


/* =========================================================
   MANAGER PIN
========================================================= */

function changeManagerPin() {

  const newPin =
    document
      .getElementById("newManagerPin")
      .value
      .trim();


  if (!/^\d{4,8}$/.test(newPin)) {

    alert(
      "PINは4～8桁の数字で入力してください。"
    );

    return;
  }


  localStorage.setItem(
    MANAGER_PIN_STORAGE_KEY,
    newPin
  );


  document
    .getElementById("newManagerPin")
    .value = "";


  alert(
    "管理者PINを変更しました。"
  );

}


/* =========================================================
   MODAL
========================================================= */

function closeModal(id) {

  const modal =
    document.getElementById(id);

  if (modal) {

    modal.classList.add(
      "hidden"
    );

  }

  document.body.classList.remove(
    "modal-open"
  );

}


function closeAllModals() {

  document
    .querySelectorAll(
      ".modal-overlay"
    )
    .forEach(modal => {

      modal.classList.add(
        "hidden"
      );

    });

  document.body.classList.remove(
    "modal-open"
  );

}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(value) {

  if (
    value === null ||
    value === undefined
  ) {
    return "";
  }

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* =========================================================
   MODAL BACKDROP CLICK
========================================================= */

document.addEventListener(
  "click",
  function(event) {

    if (
      event.target.classList.contains(
        "modal-overlay"
      )
    ) {

      event.target.classList.add(
        "hidden"
      );

      document.body.classList.remove(
        "modal-open"
      );

    }

  }
);


/* =========================================================
   ESC KEY
========================================================= */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key !== "Escape") {
      return;
    }

    closeAllModals();

  }
);
