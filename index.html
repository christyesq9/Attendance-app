<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>出退勤管理</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }

    h1 {
      text-align: center;
      margin: 15px 0 30px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .employees {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    button {
      border: 0;
      border-radius: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .employee {
      background: white;
      padding: 28px 10px;
      font-size: 21px;
      box-shadow: 0 2px 8px #ddd;
    }

    .action {
      width: 100%;
      padding: 22px;
      margin: 10px 0;
      color: white;
      font-size: 23px;
    }

    .in {
      background: #28a745;
    }

    .out {
      background: #dc3545;
    }

    .back {
      background: #777;
      color: white;
      width: 100%;
      padding: 16px;
      margin-top: 10px;
      font-size: 18px;
    }

    .name {
      text-align: center;
      font-size: 25px;
      font-weight: bold;
      margin: 25px 0;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 2px 8px #ddd;
    }

    input {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 10px;
      margin: 10px 0 20px;
      text-align: center;
    }

    .message {
      text-align: center;
      padding: 15px;
      margin-top: 20px;
      border-radius: 10px;
      background: #e8f5e9;
    }

    .error {
      color: #c00;
      text-align: center;
      padding: 20px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div id="nameScreen">
    <h1>出退勤管理</h1>
    <div class="subtitle">名前を選択してください</div>
    <div id="employees" class="employees">
      読み込み中...
    </div>
  </div>

  <div id="clockScreen" class="hidden">
    <h1>出退勤</h1>

    <div id="selectedName" class="name"></div>

    <div class="box">
      <button class="action in" onclick="clockIn()">
        🟢 出勤
      </button>

      <button class="action out" onclick="showBreak()">
        🔴 退勤
      </button>

      <button class="back" onclick="goBack()">
        ← 名前を変更
      </button>
    </div>

    <div id="message" class="message hidden"></div>
  </div>

  <div id="breakScreen" class="hidden">
    <h1>退勤</h1>

    <div class="box">
      <div id="breakName" class="name"></div>

      <p style="text-align:center;">
        今日の休憩時間を入力してください
      </p>

      <input
        id="breakMinutes"
        type="number"
        min="0"
        placeholder="例：60">

      <p style="text-align:center;">分</p>

      <button class="action out" onclick="clockOut()">
        退勤する
      </button>

      <button class="back" onclick="cancelBreak()">
        戻る
      </button>
    </div>
  </div>

</div>

<script>

const SUPABASE_URL =
  "https://yxlcnyxuziukptvtmgub.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4p3StZjP4BQA_NE7b9oMDQ_N2DeHvn5";

let selectedEmployee = null;
let todayRecord = null;


/* Load employees */

async function loadEmployees() {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/employees?select=*&active=eq.true&order=id",
      {
        headers: {
          "apikey": SUPABASE_KEY,
          "Authorization": "Bearer " + SUPABASE_KEY
        }
      }
    );

    if (!response.ok) {
      throw new Error(
        "Supabase error: " + response.status
      );
    }

    const employees = await response.json();

    const container =
      document.getElementById("employees");

    container.innerHTML = "";

    employees.forEach(employee => {

      const button =
        document.createElement("button");

      button.className = "employee";

      button.textContent = employee.name;

      button.onclick = function() {
        selectEmployee(employee);
      };

      container.appendChild(button);

    });

  } catch (error) {

    console.error(error);

    document.getElementById("employees").innerHTML =
      '<div class="error">' +
      '読み込みエラー<br><br>' +
      error.message +
      '</div>';

  }

}


/* Select employee */

async function selectEmployee(employee) {

  selectedEmployee = employee;

  document.getElementById("nameScreen")
    .classList.add("hidden");

  document.getElementById("clockScreen")
    .classList.remove("hidden");

  document.getElementById("selectedName")
    .textContent = employee.name + "さん";

  await checkToday();

}


/* Check today's attendance */

async function checkToday() {

  const today =
    new Date().toLocaleDateString("en-CA", {
      timeZone: "Asia/Tokyo"
    });

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/attendance?employee_id=eq." +
    selectedEmployee.id +
    "&work_date=eq." +
    today +
    "&select=*&order=id.desc&limit=1",
    {
      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY
      }
    }
  );

  if (response.ok) {

    const data = await response.json();

    todayRecord =
      data.length ? data[0] : null;

  }

}


/* Clock in */

async function clockIn() {

  if (todayRecord &&
      todayRecord.clock_in &&
      !todayRecord.clock_out) {

    showMessage("すでに出勤しています。");

    return;
  }

  const today =
    new Date().toLocaleDateString("en-CA", {
      timeZone: "Asia/Tokyo"
    });

  const now =
    new Date().toISOString();

  const response = await fetch(
    SUPABASE_URL + "/rest/v1/attendance",
    {
      method: "POST",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },

      body: JSON.stringify({
        employee_id: selectedEmployee.id,
        work_date: today,
        clock_in: now,
        break_minutes: 0
      })
    }
  );

  if (!response.ok) {

    showMessage(
      "出勤登録に失敗しました。"
    );

    return;
  }

  const data = await response.json();

  todayRecord = data[0];

  showMessage(
    "🟢 " +
    selectedEmployee.name +
    "さんの出勤を登録しました！"
  );

}


/* Show break screen */

function showBreak() {

  if (!todayRecord ||
      !todayRecord.clock_in) {

    showMessage(
      "先に「出勤」を登録してください。"
    );

    return;
  }

  if (todayRecord.clock_out) {

    showMessage(
      "今日はすでに退勤しています。"
    );

    return;
  }

  document.getElementById("clockScreen")
    .classList.add("hidden");

  document.getElementById("breakScreen")
    .classList.remove("hidden");

  document.getElementById("breakName")
    .textContent =
    selectedEmployee.name + "さん";

}


/* Clock out */

async function clockOut() {

  const minutes =
    parseInt(
      document.getElementById("breakMinutes").value
    );

  if (isNaN(minutes) || minutes < 0) {

    alert("休憩時間を入力してください。");

    return;
  }

  const now =
    new Date().toISOString();

  const response = await fetch(
    SUPABASE_URL +
    "/rest/v1/attendance?id=eq." +
    todayRecord.id,
    {
      method: "PATCH",

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": "Bearer " + SUPABASE_KEY,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },

      body: JSON.stringify({
        clock_out: now,
        break_minutes: minutes
      })
    }
  );

  if (!response.ok) {

    alert("退勤登録に失敗しました。");

    return;
  }

  document.getElementById("breakScreen")
    .classList.add("hidden");

  document.getElementById("clockScreen")
    .classList.remove("hidden");

  showMessage(
    "🔴 " +
    selectedEmployee.name +
    "さんの退勤を登録しました！"
  );

}


/* Back */

function goBack() {

  selectedEmployee = null;
  todayRecord = null;

  document.getElementById("clockScreen")
    .classList.add("hidden");

  document.getElementById("nameScreen")
    .classList.remove("hidden");

}


/* Cancel break */

function cancelBreak() {

  document.getElementById("breakScreen")
    .classList.add("hidden");

  document.getElementById("clockScreen")
    .classList.remove("hidden");

}


/* Message */

function showMessage(text) {

  const message =
    document.getElementById("message");

  message.textContent = text;

  message.classList.remove("hidden");

  setTimeout(function() {
    message.classList.add("hidden");
  }, 4000);

}


/* Start */

loadEmployees();

</script>

</body>
</html>
