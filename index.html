<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugar Tree Okinawa - 出退勤管理</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    Arial,
    sans-serif;
  background: #f5f5f5;
  color: #333;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
  border: none;
}

.container {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,0.08);
}

h1,
h2,
h3 {
  margin-top: 0;
}

.title {
  text-align: center;
  margin-bottom: 20px;
}

.subtitle {
  color: #777;
  text-align: center;
}

.clock {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
  margin: 10px 0 5px;
}

.date {
  text-align: center;
  color: #777;
  margin-bottom: 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.employee-btn {
  background: #fff;
  border: 2px solid #ddd;
  border-radius: 14px;
  padding: 18px 10px;
  font-size: 18px;
  font-weight: bold;
}

.employee-btn:hover {
  background: #f8f8f8;
}

.btn {
  padding: 11px 16px;
  border-radius: 10px;
  font-weight: bold;
}

.btn-primary {
  background: #333;
  color: white;
}

.btn-success {
  background: #238636;
  color: white;
}

.btn-danger {
  background: #d93025;
  color: white;
}

.btn-warning {
  background: #e6a700;
  color: white;
}

.btn-secondary {
  background: #e9e9e9;
  color: #333;
}

.btn-home {
  background: #555;
  color: white;
}

.btn-small {
  padding: 7px 10px;
  font-size: 13px;
}

.full {
  width: 100%;
}

.hidden {
  display: none !important;
}

.center {
  text-align: center;
}

.success-message {
  background: #e8f5e9;
  color: #176b2c;
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.warning-message {
  background: #fff4d6;
  color: #765500;
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 15px;
}

.error-message {
  background: #fde8e8;
  color: #a61b1b;
  padding: 14px;
  border-radius: 10px;
  margin-bottom: 15px;
}

/* Manager */

.manager-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.manager-nav {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  margin-bottom: 20px;
}

.manager-nav button {
  white-space: nowrap;
  padding: 12px 16px;
  border-radius: 10px;
  background: #e8e8e8;
}

.manager-nav button.active {
  background: #333;
  color: white;
}

.date-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 15px;
}

.date-controls input {
  flex: 1;
  min-width: 140px;
}

input,
select {
  width: 100%;
  padding: 11px;
  border: 1px solid #ccc;
  border-radius: 9px;
  background: white;
}

.form-group {
  margin-bottom: 14px;
}

.form-group label {
  display: block;
  font-weight: bold;
  margin-bottom: 6px;
}

.attendance-row {
  border: 1px solid #ddd;
  border-radius: 12px;
  padding: 15px;
  margin-bottom: 10px;
  background: white;
}

.attendance-name {
  font-size: 18px;
  font-weight: bold;
  margin-bottom: 8px;
}

.attendance-info {
  color: #555;
  margin-bottom: 10px;
}

.row-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 650px;
}

th,
td {
  padding: 10px 8px;
  border-bottom: 1px solid #ddd;
  text-align: left;
  white-space: nowrap;
}

th {
  background: #f3f3f3;
}

.incomplete {
  color: #c47c00;
  font-weight: bold;
}

.total-box {
  background: #f5f5f5;
  border-radius: 12px;
  padding: 15px;
  margin-top: 15px;
}

.total-number {
  font-size: 25px;
  font-weight: bold;
}

/* Staff management */

.staff-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  border: 1px solid #ddd;
  padding: 14px;
  border-radius: 12px;
  margin-bottom: 10px;
}

.staff-info {
  flex: 1;
}

.staff-name {
  font-weight: bold;
  font-size: 17px;
}

.staff-meta {
  color: #777;
  font-size: 13px;
  margin-top: 4px;
}

.staff-actions {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: flex-end;
}

/* MODAL
   Important: modal is fixed and has a very high z-index.
   This prevents the edit page from appearing underneath
   the 勤務履歴 page.
*/

.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 15px;
  z-index: 99999;
}

.modal {
  background: white;
  width: 100%;
  max-width: 650px;
  max-height: 92vh;
  overflow-y: auto;
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  position: relative;
  z-index: 100000;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 15px;
}

.close-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: #eee;
  font-size: 22px;
}

.history-modal {
  max-width: 900px;
}

.history-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  flex-wrap: wrap;
}

.history-month-controls {
  display: flex;
  gap: 7px;
  align-items: center;
  margin: 15px 0;
}

.history-month-controls input {
  max-width: 180px;
}

.loading {
  text-align: center;
  padding: 30px;
  color: #777;
}

.live-work-time {
  font-size: 15px;
  color: #238636;
  font-weight: bold;
}

/* Mobile */

@media (max-width: 600px) {
  .container {
    padding: 12px;
  }

  .grid {
    grid-template-columns: 1fr;
  }

  .clock {
    font-size: 25px;
  }

  .manager-header {
    align-items: stretch;
  }

  .manager-header > div {
    width: 100%;
  }

  .date-controls {
    flex-wrap: wrap;
  }

  .date-controls input {
    order: 0;
    width: 100%;
  }

  .staff-card {
    align-items: flex-start;
    flex-direction: column;
  }

  .staff-actions {
    width: 100%;
    justify-content: flex-start;
  }

  .modal {
    max-height: 95vh;
    padding: 16px;
  }
}
</style>
</head>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://yxlcnyxuziukptvtmgub.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4p3StZjP4BQA_NE7b9oMDQ_N2DeHvn5";

const JAPAN_TZ = "Asia/Tokyo";

const DEFAULT_MANAGER_PIN = "1234";

let employees = [];

let managerSelectedDate = "";
let historyEmployeeId = null;
let historyMonth = "";

let editingRecord = null;


/* =========================================================
   SUPABASE REQUEST
========================================================= */

async function supabaseRequest(
  table,
  method = "GET",
  query = "",
  body = null,
  extraHeaders = {}
) {

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${table}${query}`,
    {
      method,

      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        Prefer: "return=representation",
        ...extraHeaders
      },

      body: body
        ? JSON.stringify(body)
        : undefined
    }
  );

  const text = await response.text();

  let data = [];

  try {
    data = text ? JSON.parse(text) : [];
  } catch {
    data = text;
  }

  if (!response.ok) {

    const message =
      data?.message ||
      data?.hint ||
      data?.details ||
      `Supabase error ${response.status}`;

    throw new Error(message);
  }

  return data;
}


/* =========================================================
   DATE / TIME
========================================================= */

function japanParts(date = new Date()) {

  const parts = new Intl.DateTimeFormat(
    "en-US",
    {
      timeZone: JAPAN_TZ,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit",
      hour12: false
    }
  ).formatToParts(date);

  const result = {};

  parts.forEach(p => {
    result[p.type] = p.value;
  });

  if (result.hour === "24") {
    result.hour = "00";
  }

  return result;
}


function getJapanDate() {

  const p = japanParts();

  return `${p.year}-${p.month}-${p.day}`;
}


function getJapanMonth() {

  return getJapanDate().slice(0, 7);
}


function getJapanDateTimeLocal() {

  const p = japanParts();

  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}


function localDateTimeToISO(value) {

  if (!value) return null;

  return new Date(value).toISOString();
}


function isoToLocalInput(iso) {

  if (!iso) return "";

  const p = japanParts(new Date(iso));

  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}


function formatTime(iso) {

  if (!iso) return "-";

  const p = japanParts(new Date(iso));

  return `${p.hour}:${p.minute}`;
}


function formatDate(dateString) {

  if (!dateString) return "-";

  const [y, m, d] = dateString.split("-");

  return `${y}/${m}/${d}`;
}


/* =========================================================
   WORK TIME
========================================================= */

function calculateMinutes(clockIn, clockOut, breakMinutes = 0) {

  if (!clockIn || !clockOut) {
    return 0;
  }

  const start = new Date(clockIn);
  const end = new Date(clockOut);

  const minutes =
    Math.floor((end - start) / 60000)
    - Number(breakMinutes || 0);

  return Math.max(0, minutes);
}


function minutesToText(minutes) {

  minutes = Number(minutes || 0);

  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;

  return `${hours}時間 ${mins}分`;
}


function minutesToDecimalHours(minutes) {

  return Number(minutes || 0) / 60;
}


/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* =========================================================
   CLOCK
========================================================= */

function updateLiveClock() {

  const p = japanParts();

  const clock =
    `${p.hour}:${p.minute}:${p.second}`;

  const date =
    `${p.year}年${Number(p.month)}月${Number(p.day)}日`;

  document.getElementById("liveClock").textContent = clock;
  document.getElementById("liveDate").textContent = date;
}


/* =========================================================
   EMPLOYEES
========================================================= */

async function loadEmployees() {

  try {

    employees = await supabaseRequest(
      "employees",
      "GET",
      "?select=*&order=name.asc"
    );

    renderEmployeeButtons();
    renderStaffManagement();

  } catch (error) {

    console.error(error);

    document.getElementById("employeeButtons").innerHTML =
      `<div class="error-message">
        スタッフ情報を読み込めませんでした。<br>
        ${escapeHtml(error.message)}
      </div>`;
  }
}


function renderEmployeeButtons() {

  const container =
    document.getElementById("employeeButtons");

  const activeEmployees =
    employees.filter(e => e.active !== false);

  if (!activeEmployees.length) {

    container.innerHTML =
      `<div class="warning-message">
        現在、登録されているスタッフがありません。
      </div>`;

    return;
  }

  container.innerHTML =
    activeEmployees.map(employee => {

      return `
        <button
          class="employee-btn"
          onclick="openAttendance('${employee.id}')"
        >
          ${escapeHtml(employee.name)}
        </button>
      `;

    }).join("");
}


/* =========================================================
   STAFF ATTENDANCE
========================================================= */

let currentAttendanceEmployee = null;
let currentAttendanceRecord = null;
let attendanceTimer = null;


async function openAttendance(employeeId) {

  currentAttendanceEmployee =
    employees.find(e => e.id === employeeId);

  if (!currentAttendanceEmployee) return;

  document.getElementById(
    "attendanceEmployeeName"
  ).textContent =
    currentAttendanceEmployee.name;

  document.getElementById(
    "attendanceModal"
  ).classList.remove("hidden");

  await refreshAttendanceModal();
}


async function refreshAttendanceModal() {

  if (!currentAttendanceEmployee) return;

  const today = getJapanDate();

  const records =
    await getAttendanceForEmployeeDate(
      currentAttendanceEmployee.id,
      today
    );

  currentAttendanceRecord =
    choosePrimaryAttendanceRecord(records);

  renderAttendanceModal();

  if (attendanceTimer) {
    clearInterval(attendanceTimer);
  }

  attendanceTimer =
    setInterval(renderAttendanceModal, 1000);
}


function renderAttendanceModal() {

  const status =
    document.getElementById("attendanceStatus");

  const actions =
    document.getElementById("attendanceActions");

  const workTime =
    document.getElementById("attendanceWorkTime");

  if (!currentAttendanceRecord) {

    status.innerHTML =
      `<div class="warning-message">
        本日はまだ出勤していません。
      </div>`;

    actions.innerHTML =
      `<button
        class="btn btn-success full"
        onclick="clockIn()"
      >
        🟢 出勤
      </button>`;

    workTime.textContent = "";

    return;
  }


  if (
    currentAttendanceRecord.clock_in &&
    !currentAttendanceRecord.clock_out
  ) {

    const elapsed =
      calculateMinutes(
        currentAttendanceRecord.clock_in,
        new Date().toISOString(),
        0
      );

    status.innerHTML =
      `<div class="success-message">
        出勤中<br>
        出勤時刻：${formatTime(currentAttendanceRecord.clock_in)}
      </div>`;

    workTime.textContent =
      `現在の実働時間：約 ${minutesToText(elapsed)}`;

    actions.innerHTML =
      `<button
        class="btn btn-danger full"
        onclick="clockOut()"
      >
        🔴 退勤
      </button>`;

    return;
  }


  if (
    currentAttendanceRecord.clock_in &&
    currentAttendanceRecord.clock_out
  ) {

    const minutes =
      calculateMinutes(
        currentAttendanceRecord.clock_in,
        currentAttendanceRecord.clock_out,
        currentAttendanceRecord.break_minutes
      );

    status.innerHTML =
      `<div class="success-message">
        本日の勤務は終了しています。<br>
        出勤：${formatTime(currentAttendanceRecord.clock_in)}　
        退勤：${formatTime(currentAttendanceRecord.clock_out)}<br>
        休憩：${currentAttendanceRecord.break_minutes || 0}分
      </div>`;

    workTime.textContent =
      `実働時間：${minutesToText(minutes)}`;

    actions.innerHTML =
      `<button
        class="btn btn-secondary full"
        onclick="closeAttendanceModal()"
      >
        閉じる
      </button>`;

    return;
  }

  actions.innerHTML =
    `<button
      class="btn btn-success full"
      onclick="clockIn()"
    >
      🟢 出勤
    </button>`;
}


async function clockIn() {

  if (!currentAttendanceEmployee) return;

  try {

    const today = getJapanDate();

    const now = new Date().toISOString();

    const existing =
      await getAttendanceForEmployeeDate(
        currentAttendanceEmployee.id,
        today
      );

    const primary =
      choosePrimaryAttendanceRecord(existing);

    if (primary) {

      await supabaseRequest(
        "attendance",
        "PATCH",
        `?id=eq.${encodeURIComponent(primary.id)}`,
        {
          clock_in: now,
          clock_out: null,
          break_minutes: 0
        }
      );

    } else {

      await supabaseRequest(
        "attendance",
        "POST",
        "",
        {
          employee_id: currentAttendanceEmployee.id,
          work_date: today,
          clock_in: now,
          clock_out: null,
          break_minutes: 0
        }
      );
    }

    await refreshAttendanceModal();

  } catch (error) {

    alert(
      "出勤登録に失敗しました。\n" +
      error.message
    );
  }
}


async function clockOut() {

  if (!currentAttendanceRecord) return;

  const breakInput =
    prompt(
      "休憩時間を入力してください（分）",
      currentAttendanceRecord.break_minutes || "0"
    );

  if (breakInput === null) return;

  const breakMinutes =
    Number(breakInput);

  if (
    !Number.isFinite(breakMinutes) ||
    breakMinutes < 0
  ) {

    alert("休憩時間を正しく入力してください。");
    return;
  }

  try {

    await supabaseRequest(
      "attendance",
      "PATCH",
      `?id=eq.${encodeURIComponent(currentAttendanceRecord.id)}`,
      {
        clock_out: new Date().toISOString(),
        break_minutes: breakMinutes
      }
    );

    await refreshAttendanceModal();

  } catch (error) {

    alert(
      "退勤登録に失敗しました。\n" +
      error.message
    );
  }
}


function closeAttendanceModal() {

  document
    .getElementById("attendanceModal")
    .classList.add("hidden");

  if (attendanceTimer) {
    clearInterval(attendanceTimer);
    attendanceTimer = null;
  }

  currentAttendanceEmployee = null;
  currentAttendanceRecord = null;
}


/* =========================================================
   ATTENDANCE HELPERS
========================================================= */

async function getAttendanceForEmployeeDate(
  employeeId,
  workDate
) {

  return await supabaseRequest(
    "attendance",
    "GET",
    `?select=*&employee_id=eq.${encodeURIComponent(employeeId)}&work_date=eq.${encodeURIComponent(workDate)}&order=clock_in.desc`
  );
}


function choosePrimaryAttendanceRecord(records) {

  if (!records || !records.length) {
    return null;
  }

  return records
    .slice()
    .sort((a, b) => {

      const aHas =
        a.clock_in ? 1 : 0;

      const bHas =
        b.clock_in ? 1 : 0;

      if (aHas !== bHas) {
        return bHas - aHas;
      }

      return String(b.clock_in || "")
        .localeCompare(
          String(a.clock_in || "")
        );
    })[0];
}


function dedupeAttendanceRecords(records) {

  const map = new Map();

  for (const record of records || []) {

    const key =
      `${record.employee_id}__${record.work_date}`;

    const existing = map.get(key);

    if (!existing) {

      map.set(key, record);

    } else {

      map.set(
        key,
        choosePrimaryAttendanceRecord([
          existing,
          record
        ])
      );
    }
  }

  return Array.from(map.values());
}

/* =========================================================
   DAILY DATE NAVIGATION
========================================================= */

function changeManagerDate(days) {

  const parts =
    managerSelectedDate.split("-");

  let year = Number(parts[0]);
  let month = Number(parts[1]);
  let day = Number(parts[2]);

  const date =
    new Date(
      Date.UTC(
        year,
        month - 1,
        day
      )
    );

  date.setUTCDate(
    date.getUTCDate() + days
  );

  year =
    date.getUTCFullYear();

  month =
    date.getUTCMonth() + 1;

  day =
    date.getUTCDate();

  managerSelectedDate =
    `${year}-${String(month).padStart(2, "0")}-${String(day).padStart(2, "0")}`;

  document.getElementById(
    "managerDate"
  ).value = managerSelectedDate;

  loadDailyAttendance();
}


/* =========================================================
   DAILY ATTENDANCE
========================================================= */

async function loadDailyAttendance() {

  const container =
    document.getElementById("dailyAttendance");

  container.innerHTML =
    `<div class="loading">読み込み中...</div>`;

  try {

    if (!managerSelectedDate) {
      managerSelectedDate = getJapanDate();
    }

    const records =
      await supabaseRequest(
        "attendance",
        "GET",
        `?select=*&work_date=eq.${encodeURIComponent(managerSelectedDate)}&order=clock_in.asc`
      );

    const deduped =
      dedupeAttendanceRecords(records);

    const activeEmployees =
      employees.filter(e => e.active !== false);

    if (!activeEmployees.length) {

      container.innerHTML =
        `<div class="warning-message">
          アクティブなスタッフがいません。
        </div>`;

      return;
    }


    container.innerHTML =
      activeEmployees.map(employee => {

        const record =
          deduped.find(
            r => r.employee_id === employee.id
          );

        let info = "勤務データなし";

        let statusClass = "";

        if (record?.clock_in && record?.clock_out) {

          const minutes =
            calculateMinutes(
              record.clock_in,
              record.clock_out,
              record.break_minutes
            );

          info =
            `出勤 ${formatTime(record.clock_in)}
            　退勤 ${formatTime(record.clock_out)}
            　休憩 ${record.break_minutes || 0}分
            　実働 ${minutesToText(minutes)}`;

        } else if (record?.clock_in) {

          info =
            `出勤 ${formatTime(record.clock_in)}
            　<span class="incomplete">出勤中</span>`;

          statusClass = "incomplete";

        }


        return `
          <div class="attendance-row">

            <div class="attendance-name">
              ${escapeHtml(employee.name)}
            </div>

            <div class="attendance-info ${statusClass}">
              ${info}
            </div>

            <div class="row-buttons">

              ${
                record
                ?
                `<button
                  class="btn btn-primary btn-small"
                  onclick="openEdit('${record.id}')"
                >
                  編集
                </button>

                <button
                  class="btn btn-warning btn-small"
                  onclick="resetAttendance('${record.id}')"
                >
                  0時間にリセット
                </button>`
                :
                `<button
                  class="btn btn-secondary btn-small"
                  onclick="openNewAttendance('${employee.id}')"
                >
                  勤務データ入力
                </button>`
              }

            </div>

          </div>
        `;

      }).join("");

  } catch (error) {

    console.error(error);

    container.innerHTML =
      `<div class="error-message">
        勤務データを読み込めませんでした。<br>
        ${escapeHtml(error.message)}
      </div>`;
  }
}

   NEW / EDIT ATTENDANCE
========================================================= */

async function openNewAttendance(employeeId) {

  const employee =
    employees.find(e => e.id === employeeId);

  if (!employee) return;

  const existing =
    await getAttendanceForEmployeeDate(
      employeeId,
      managerSelectedDate
    );

  const primary =
    choosePrimaryAttendanceRecord(existing);

  if (primary) {

    await openEdit(primary.id);
    return;
  }

  editingRecord = null;

  document.getElementById(
    "editRecordId"
  ).value = "";

  document.getElementById(
    "editEmployeeId"
  ).value = employee.id;

  document.getElementById(
    "editEmployeeName"
  ).value = employee.name;

  document.getElementById(
    "editWorkDate"
  ).value = managerSelectedDate;

  document.getElementById(
    "editClockIn"
  ).value = "";

  document.getElementById(
    "editClockOut"
  ).value = "";

  document.getElementById(
    "editBreakMinutes"
  ).value = "0";

  document.getElementById(
    "editError"
  ).innerHTML = "";

  // IMPORTANT:
  // Edit modal is fixed and has z-index 99999.
  // It will appear ABOVE the history modal.
  document
    .getElementById("editAttendanceModal")
    .classList.remove("hidden");
}


async function openEdit(recordId) {

  try {

    const records =
      await supabaseRequest(
        "attendance",
        "GET",
        `?select=*&id=eq.${encodeURIComponent(recordId)}`
      );

    if (!records.length) {

      alert("勤務データが見つかりません。");
      return;
    }

    const record = records[0];

    editingRecord = record;

    const employee =
      employees.find(
        e => e.id === record.employee_id
      );

    document.getElementById(
      "editRecordId"
    ).value = record.id;

    document.getElementById(
      "editEmployeeId"
    ).value = record.employee_id;

    document.getElementById(
      "editEmployeeName"
    ).value =
      employee?.name || "不明";

    document.getElementById(
      "editWorkDate"
    ).value = record.work_date;

    document.getElementById(
      "editClockIn"
    ).value =
      isoToLocalInput(record.clock_in);

    document.getElementById(
      "editClockOut"
    ).value =
      isoToLocalInput(record.clock_out);

    document.getElementById(
      "editBreakMinutes"
    ).value =
      record.break_minutes || 0;

    document.getElementById(
      "editError"
    ).innerHTML = "";

    document
      .getElementById("editAttendanceModal")
      .classList.remove("hidden");

  } catch (error) {

    alert(
      "勤務データを開けませんでした。\n" +
      error.message
    );
  }
}

async function openHistoryEdit(recordId) {

async function saveEditedAttendance() {

  const recordId =
    document.getElementById(
      "editRecordId"
    ).value;

  const employeeId =
    document.getElementById(
      "editEmployeeId"
    ).value;

  const workDate =
    document.getElementById(
      "editWorkDate"
    ).value;

  const clockIn =
    document.getElementById(
      "editClockIn"
    ).value;

  const clockOut =
    document.getElementById(
      "editClockOut"
    ).value;

  const breakMinutes =
    Number(
      document.getElementById(
        "editBreakMinutes"
      ).value || 0
    );

  if (!employeeId || !workDate) {

    alert("スタッフと勤務日を確認してください。");
    return;
  }

  if (breakMinutes < 0) {

    alert("休憩時間を確認してください。");
    return;
  }


  try {

    /*
     * Prevent duplicate employee/date records.
     */
    const sameDay =
      await getAttendanceForEmployeeDate(
        employeeId,
        workDate
      );

    const conflicting =
      sameDay.find(
        r => r.id !== recordId
      );

    if (conflicting) {

      document.getElementById(
        "editError"
      ).innerHTML =
        `<div class="error-message">
          このスタッフには ${formatDate(workDate)}
          の勤務データがすでに存在します。
          <br><br>
          重複登録を防ぐため保存できません。
        </div>`;

      return;
    }


    const data = {

      employee_id: employeeId,

      work_date: workDate,

      clock_in:
        localDateTimeToISO(clockIn),

      clock_out:
        localDateTimeToISO(clockOut),

      break_minutes:
        breakMinutes
    };


    if (recordId) {

      await supabaseRequest(
        "attendance",
        "PATCH",
        `?id=eq.${encodeURIComponent(recordId)}`,
        data
      );

    } else {

      await supabaseRequest(
        "attendance",
        "POST",
        "",
        data
      );
    }


    closeEditModal();

    await loadDailyAttendance();

    if (
      !document
        .getElementById("historyModal")
        .classList.contains("hidden")
    ) {

      await loadStaffHistory();
    }


  } catch (error) {

    document.getElementById(
      "editError"
    ).innerHTML =
      `<div class="error-message">
        保存に失敗しました。<br>
        ${escapeHtml(error.message)}
      </div>`;
  }
}

}

      "出勤・退勤時刻は空になります。"

  try {

      "attendance",

        clock_out: null,
        break_minutes: 0

    );

    await loadDailyAttendance();

  } catch (error) {

    alert(
      "リセットに失敗しました。\n" +
      error.message
    );
  }
}

  const records =

    );

  const deduped =
    dedupeAttendanceRecords(records);

  const container =

    );

  if (!activeEmployees.length) {

    container.innerHTML =

      </div>`;

  } else {

    container.innerHTML =
      activeEmployees.map(employee => {

        const record =
          deduped.find(
            r => r.employee_id === employee.id
          );

        return `
          <div
            class="attendance-row"
            data-bulk-employee="${employee.id}"
            data-bulk-record="${record?.id || ""}"
          >

              ${escapeHtml(employee.name)}
            </div>

            <div class="form-group">
              <label>出勤</label>
              <input
                type="datetime-local"
                class="bulk-clock-in"
                value="${record ? isoToLocalInput(record.clock_in) : ""}"
              >
            </div>

            <div class="form-group">
              <label>退勤</label>
              <input
                type="datetime-local"
                class="bulk-clock-out"
                value="${record ? isoToLocalInput(record.clock_out) : ""}"
              >
            </div>

            <div class="form-group">
              <label>休憩（分）</label>
              <input
                type="number"
                class="bulk-break"
                min="0"
                value="${record?.break_minutes || 0}"
              >
            </div>

          </div>
        `;

      }).join("");
  }

  document
    .getElementById("bulkEntryModal")
    .classList.remove("hidden");
}


function closeBulkEntry() {

  document
    .getElementById("bulkEntryModal")
    .classList.add("hidden");
}


async function saveBulkEntry() {

  const rows =
    document.querySelectorAll(
      "[data-bulk-employee]"
    );

  try {

    for (const row of rows) {

      const employeeId =
        row.dataset.bulkEmployee;

      let recordId =
        row.dataset.bulkRecord;

      const clockIn =
        row.querySelector(
          ".bulk-clock-in"
        ).value;

      const clockOut =
        row.querySelector(
          ".bulk-clock-out"
        ).value;

      const breakMinutes =
        Number(
          row.querySelector(
            ".bulk-break"
          ).value || 0
        );


      const data = {

        employee_id: employeeId,

        work_date:
          managerSelectedDate,

        clock_in:
          localDateTimeToISO(clockIn),

        clock_out:
          localDateTimeToISO(clockOut),

        break_minutes:
          breakMinutes
      };


      /*
       * If there is no known ID, check database again
       * before inserting. This helps prevent duplicates.
       */
      if (!recordId) {

        const existing =
          await getAttendanceForEmployeeDate(
            employeeId,
            managerSelectedDate
          );

        const primary =
          choosePrimaryAttendanceRecord(existing);

        if (primary) {
          recordId = primary.id;
        }
      }


      if (recordId) {

        await supabaseRequest(
          "attendance",
          "PATCH",
          `?id=eq.${encodeURIComponent(recordId)}`,
          data
        );

      } else {

        /*
         * Don't create a totally blank row.
         */
        if (!clockIn && !clockOut) {
          continue;
        }

        await supabaseRequest(
          "attendance",
          "POST",
          "",
          data
        );
      }
    }


    closeBulkEntry();

    await loadDailyAttendance();

  } catch (error) {

    alert(
      "一括保存に失敗しました。\n" +
      error.message
    );
  }
}

async function addEmployee() {

  const name =
    document.getElementById(
      "newStaffName"
    ).value.trim();

  const rate =
    Number(
      document.getElementById(
        "newStaffRate"
      ).value
    );


  if (!name) {

    alert("スタッフ名を入力してください。");
    return;
  }

  if (
    !Number.isFinite(rate) ||
    rate < 0
  ) {

    alert("時給を正しく入力してください。");
    return;
  }


  try {

    /*
     * Generate employee code automatically.
     */
    const existingCodes =
      employees
        .map(e => e.employee_code)
        .filter(Boolean);

    let number = 1;

    let employeeCode;

    do {

      employeeCode =
        `EMP${String(number).padStart(3, "0")}`;

      number++;

    } while (
      existingCodes.includes(employeeCode)
    );


    await supabaseRequest(
      "employees",
      "POST",
      "",
      {
        name,
        active: true,
        employee_code: employeeCode,
        hourly_rate: rate
      }
    );


    document.getElementById(
      "newStaffName"
    ).value = "";

    document.getElementById(
      "newStaffRate"
    ).value = "";

    await loadEmployees();

    alert("スタッフを追加しました。");

  } catch (error) {

    alert(
      "スタッフ追加に失敗しました。\n" +
      error.message
    );
  }
}


async function editEmployee(employeeId) {

  const employee =
    employees.find(
      e => e.id === employeeId

  if (!employee) return;


  const name =
    prompt(

      employee.name
    );

  if (name === null) return;

  const rate =
    prompt(
      "時給（円）",

  loadStaffHistory();
}


function closeHistoryModal() {

  historyEmployeeId = null;
}


function changeHistoryMonth(direction) {

  if (!historyMonth) {
    historyMonth = getJapanMonth();
  }

  const parts =
    historyMonth.split("-");

  let year =
    Number(parts[0]);

  let month =
    Number(parts[1]);

  month += direction;

  if (month > 12) {

    month = 1;
    year++;

  }

  if (month < 1) {

    month = 12;
    year--;
  }

  historyMonth =
    `${year}-${String(month).padStart(2, "0")}`;

  document.getElementById(
    "historyMonth"
  ).value = historyMonth;

  loadStaffHistory();
}


function getNextMonth(month) {

  const [
    year,
    monthNumber
  ] =
    month.split("-").map(Number);

  let nextYear = year;

  let nextMonth =
    monthNumber + 1;

  if (nextMonth > 12) {

    nextMonth = 1;
    nextYear++;
  }

  return `${nextYear}-${String(nextMonth).padStart(2, "0")}`;
}


async function loadStaffHistory() {

  if (!historyEmployeeId) return;

  const container =
    document.getElementById(
      "staffHistoryContent"
    );

  container.innerHTML =
    `<div class="loading">
      読み込み中...
    </div>`;


  try {

    const nextMonth =
      getNextMonth(historyMonth);


    const records =
      await supabaseRequest(
        "attendance",
        "GET",
        `?select=*&employee_id=eq.${encodeURIComponent(historyEmployeeId)}&work_date=gte.${encodeURIComponent(historyMonth + "-01")}&work_date=lt.${encodeURIComponent(nextMonth + "-01")}&order=work_date.desc`
      );


    const deduped =
      dedupeAttendanceRecords(records);


    const completed =
      deduped.filter(
        r => r.clock_in && r.clock_out
      );


    const incomplete =
      deduped.filter(
        r =>
          (r.clock_in && !r.clock_out) ||
          (!r.clock_in && r.clock_out)
      );


    let totalMinutes = 0;
    let totalPay = 0;


    const employee =
      employees.find(
        e => e.id === historyEmployeeId
      );

    const hourlyRate =
      Number(
        employee?.hourly_rate || 0
      );


    completed.forEach(record => {

      const minutes =
        calculateMinutes(
          record.clock_in,
          record.clock_out,
          record.break_minutes
        );

      totalMinutes += minutes;

      totalPay +=
        minutesToDecimalHours(minutes)
        * hourlyRate;
    });


    let html = "";


    if (!deduped.length) {

      html =
        `<div class="warning-message">
          この月の勤務データはありません。
        </div>`;

    } else {

      html += `
        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>日付</th>
                <th>出勤</th>
                <th>退勤</th>
                <th>休憩</th>
                <th>実働</th>
                <th>概算給与</th>
                <th>操作</th>
              </tr>
            </thead>

            <tbody>
      `;


      deduped.forEach(record => {

        const isComplete =
          record.clock_in &&
          record.clock_out;

        const minutes =
          isComplete
          ?
          calculateMinutes(
            record.clock_in,
            record.clock_out,
            record.break_minutes
          )
          :
          0;

        const pay =
          isComplete
          ?
          minutesToDecimalHours(minutes)
          * hourlyRate
          :
          0;


        html += `
          <tr>

            <td>
              ${formatDate(record.work_date)}
            </td>

            <td>
              ${formatTime(record.clock_in)}
            </td>

            <td>
              ${
                record.clock_out
                ? formatTime(record.clock_out)
                : '<span class="incomplete">未退勤</span>'
              }
            </td>

            <td>
              ${record.break_minutes || 0}分
            </td>

            <td>
              ${
                isComplete
                ? minutesToText(minutes)
                : '<span class="incomplete">未完了</span>'
              }
            </td>

            <td>
              ${
                isComplete
                ? "¥" + Math.round(pay).toLocaleString()
                : "-"
              }
            </td>

            <td>

              <div style="display:flex; gap:5px;">

                <button
                  type="button"
                  class="btn btn-primary btn-small"
                  onclick="openHistoryEdit('${record.id}')"
                >
                  編集
                </button>

                <button
                  type="button"
                  class="btn btn-danger btn-small"
                  onclick="deleteHistoryShift('${record.employee_id}', '${record.work_date}')"
                >
                  削除
                </button>

              </div>

            </td>

          </tr>
        `;
      });


      html += `
            </tbody>

          </table>

        </div>
      `;
    }


    html += `
      <div class="total-box">

        <div>
          勤務日数：
          <strong>${completed.length}日</strong>
        </div>

        ${
          incomplete.length
          ?
          `<div class="incomplete">
            未完了勤務：${incomplete.length}件
          </div>`
          :
          ""
        }

        <div>
          総実働時間：
          <strong>${minutesToText(totalMinutes)}</strong>
        </div>

        <div>
          時給：
          <strong>¥${hourlyRate.toLocaleString()}</strong>
        </div>

        <div style="margin-top:8px;">
          概算給与：
          <span class="total-number">
            ¥${Math.round(totalPay).toLocaleString()}
          </span>
        </div>

      </div>
    `;


    container.innerHTML = html;


  } catch (error) {

    container.innerHTML =
      `<div class="error-message">
        勤務履歴を読み込めませんでした。<br>
        ${escapeHtml(error.message)}
      </div>`;
  }
}


/* =========================================================
   DELETE HISTORY
========================================================= */

async function deleteHistoryShift(
  employeeId,
  workDate
) {

  const employee =
    employees.find(
      e => e.id === employeeId
    );

  const employeeName =
    employee?.name || "このスタッフ";


  if (
    !confirm(
      `${employeeName} さんの ${formatDate(workDate)} の勤務データを削除します。\n\n` +
      "この操作は元に戻せません。\n" +
      "本当に削除しますか？"
    )
  ) {
    return;
  }


  try {

    /*
     * First check what actually exists.
     * We delete by employee + date instead of only ID.
     * This also removes accidental duplicate records.
     */
    const before =
      await getAttendanceForEmployeeDate(
        employeeId,
        workDate
      );


    if (!before.length) {

      alert("削除対象の勤務データが見つかりません。");

      await loadStaffHistory();

      return;
    }


    await supabaseRequest(
      "attendance",
      "DELETE",
      `?employee_id=eq.${encodeURIComponent(employeeId)}&work_date=eq.${encodeURIComponent(workDate)}`
    );


    /*
     * IMPORTANT:
     * Verify the delete really happened.
     *
     * If RLS blocks DELETE, Supabase can sometimes return
     * no useful error while leaving the record untouched.
     */
    const after =
      await getAttendanceForEmployeeDate(
        employeeId,
        workDate
      );


    if (after.length > 0) {

      throw new Error(
        "勤務データを削除できませんでした。\n" +
        "SupabaseのDELETE権限（RLS）を確認してください。"
      );
    }


    /*
     * Reload history so the deleted row disappears immediately.
     */
    await loadStaffHistory();

    /*
     * Also refresh daily manager screen in case
     * the deleted date is currently being viewed.
     */
    await loadDailyAttendance();


    alert("勤務データを削除しました。");


  } catch (error) {

    alert(
      "削除に失敗しました。\n\n" +
      error.message
    );
  }
}

/* =========================================================
   CSV
========================================================= */

function csvEscape(value) {

  const string =
    String(value ?? "");

  if (
    string.includes(",") ||
    string.includes('"') ||
    string.includes("\n")
  ) {

    return `"${string.replace(/"/g, '""')}"`;
  }

  return string;
}


function downloadCSV(
  filename,
  rows
) {

  const csv =
    rows
      .map(row =>
        row.map(csvEscape).join(",")
      )
      .join("\r\n");


  const blob =
    new Blob(
      ["\uFEFF" + csv],
      {
        type: "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement("a");

  link.href = url;

  link.download = filename;

  document.body.appendChild(link);

  link.click();

  link.remove();

  URL.revokeObjectURL(url);
}
