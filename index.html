<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sugar Tree Okinawa 出退勤管理</title>

<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
  background: #f5f5f5;
  color: #333;
}

body {
  min-height: 100vh;
}

button,
input,
select {
  font: inherit;
}

button {
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

.hidden {
  display: none !important;
  pointer-events: none !important;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.card {
  background: #fff;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 18px;
  box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

.title {
  text-align: center;
  margin-bottom: 20px;
}

.subtitle {
  color: #777;
  text-align: center;
}

h1, h2, h3 {
  margin-top: 0;
}

.clock {
  text-align: center;
  font-size: 30px;
  font-weight: bold;
}

.date {
  text-align: center;
  color: #777;
  margin-top: 5px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.employee-btn {
  background: #fff;
  border: 2px solid #ddd;
  border-radius: 14px;
  padding: 18px 10px;
  font-size: 18px;
  font-weight: bold;
}

.btn {
  border: none;
  border-radius: 10px;
  padding: 10px 14px;
  font-weight: bold;
  cursor: pointer;
}

.btn-primary {
  background: #333;
  color: white;
}

.btn-success {
  background: #238636;
  color: white;
}

.btn-danger {
  background: #d93025;
  color: white;
}

.btn-warning {
  background: #e6a700;
  color: white;
}

.btn-secondary {
  background: #e9e9e9;
  color: #333;
}

.btn-home {
  background: #555;
  color: white;
}

.btn-small {
  padding: 7px 10px;
  font-size: 13px;
}

.full {
  width: 100%;
}

.center {
  text-align: center;
}

.loading {
  text-align: center;
  padding: 25px;
  color: #777;
}

.success-message,
.warning-message,
.error-message {

  border-radius: 10px;
  margin-bottom: 12px;
}

.success-message {
  background: #e8f5e9;
  color: #176b2c;
}

.warning-message {

  color: #765500;
}

.error-message {
  background: #fde8e8;

}

.manager-header {

  justify-content: space-between;

  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.manager-nav {
  display: flex;
  gap: 8px;

  margin-bottom: 20px;
}

.manager-nav button {

  background: #e8e8e8;
  padding: 12px 16px;

}

.manager-nav button.active {

}

.date-controls {

  gap: 8px;

}

.date-controls input {

}

input,

.form-group {

.form-group label {

}

.attendance-row {

.attendance-name {

.attendance-info {

.row-buttons,

}

.staff-card {

/* =========================

========================= */

.modal-overlay {

  height: 100%;

<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://yxlcnyxuziukptvtmgub.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_4p3StZjP4BQA_NE7b9oMDQ_N2DeHvn5";

const JAPAN_TZ = "Asia/Tokyo";

const DEFAULT_MANAGER_PIN = "1234";

let employees = [];

let managerSelectedDate = "";

let historyEmployeeId = null;

let historyMonth = "";

let currentAttendanceEmployee = null;

let currentAttendanceRecord = null;

let attendanceTimer = null;


/* =====================================================
   SUPABASE REQUEST
===================================================== */

async function supabaseRequest(
  table,
  method = "GET",
  query = "",
  body = null
) {

  const response = await fetch(
    `${SUPABASE_URL}/rest/v1/${table}${query}`,
    {
      method: method,

      headers: {
        "apikey": SUPABASE_KEY,
        "Authorization": `Bearer ${SUPABASE_KEY}`,
        "Content-Type": "application/json",
        "Prefer": "return=representation"
      },

      body:
        body !== null
        ? JSON.stringify(body)
        : undefined
    }
  );

  const text =
    await response.text();

  let data = [];

  try {
    data =
      text
      ? JSON.parse(text)
      : [];

  } catch {
    data = text;
  }

  if (!response.ok) {

    throw new Error(
      data?.message ||
      data?.hint ||
      data?.details ||
      `Supabase error ${response.status}`
    );
  }

  return data;
}


/* =====================================================
   DATE / TIME
===================================================== */

function japanParts(date = new Date()) {

  const parts =
    new Intl.DateTimeFormat(
      "en-US",
      {
        timeZone: JAPAN_TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }
    ).formatToParts(date);

  const result = {};

  parts.forEach(p => {
    result[p.type] = p.value;
  });

  if (result.hour === "24") {
    result.hour = "00";
  }

  return result;
}


function getJapanDate() {

  const p = japanParts();

  return `${p.year}-${p.month}-${p.day}`;
}


function getJapanMonth() {

  return getJapanDate().slice(0, 7);
}


function localDateTimeToISO(value) {

  if (!value) return null;

  return new Date(value).toISOString();
}


function isoToLocalInput(iso) {

  if (!iso) return "";

  const p =
    japanParts(new Date(iso));

  return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}`;
}


function formatTime(iso) {

  if (!iso) return "-";

  const p =
    japanParts(new Date(iso));

  return `${p.hour}:${p.minute}`;
}


function formatDate(dateString) {

  if (!dateString) return "-";

  const [y,m,d] =
    dateString.split("-");

  return `${y}/${m}/${d}`;
}


/* =====================================================
   WORK TIME
===================================================== */

function calculateMinutes(
  clockIn,
  clockOut,
  breakMinutes = 0
) {

  if (!clockIn || !clockOut) {
    return 0;
  }

  const start =
    new Date(clockIn);

  const end =
    new Date(clockOut);

  return Math.max(
    0,
    Math.floor(
      (end - start) / 60000
    ) -
    Number(breakMinutes || 0)
  );
}


function minutesToText(minutes) {

  minutes =
    Number(minutes || 0);

  const hours =
    Math.floor(minutes / 60);

  const mins =
    minutes % 60;

  return `${hours}時間 ${mins}分`;
}


/* =====================================================
   ESCAPE
===================================================== */

function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =====================================================
   CLOCK
===================================================== */

function updateLiveClock() {

  const p =
    japanParts();

  document.getElementById(
    "liveClock"
  ).textContent =
    `${p.hour}:${p.minute}:${p.second}`;

  document.getElementById(
    "liveDate"
  ).textContent =
    `${p.year}年${Number(p.month)}月${Number(p.day)}日`;
}


/* =====================================================
   EMPLOYEES
===================================================== */

async function loadEmployees() {

  try {

    employees =
      await supabaseRequest(
        "employees",
        "GET",
        "?select=*&order=name.asc"
      );

    renderEmployeeButtons();

    renderStaffManagement();

  } catch(error) {

    console.error(error);

    document.getElementById(
      "employeeButtons"
    ).innerHTML =
      `<div class="error-message">
        スタッフ情報を読み込めませんでした。<br>
        ${escapeHtml(error.message)}
      </div>`;
  }
}


function renderEmployeeButtons() {

  const container =
    document.getElementById(
      "employeeButtons"
    );

  const active =
    employees.filter(
      e => e.active !== false
    );

  if (!active.length) {

    container.innerHTML =
      `<div class="warning-message">
        現在、登録されているスタッフがありません。
      </div>`;

    return;
  }

  container.innerHTML =
    active.map(e => `
      <button
        type="button"
        class="employee-btn"
        onclick="openAttendance('${e.id}')"
      >
        ${escapeHtml(e.name)}
      </button>
    `).join("");
}


/* =====================================================
   ATTENDANCE HELPERS
===================================================== */

async function getAttendanceForEmployeeDate(
  employeeId,
  workDate
) {

  return await supabaseRequest(
    "attendance",
    "GET",
    `?select=*&employee_id=eq.${encodeURIComponent(employeeId)}&work_date=eq.${encodeURIComponent(workDate)}&order=clock_in.desc`
  );
}


function choosePrimaryAttendanceRecord(records) {

  if (!records || !records.length) {
    return null;
  }

  return records
    .slice()
    .sort((a,b) => {

      const aHas =
        a.clock_in ? 1 : 0;

      const bHas =
        b.clock_in ? 1 : 0;

      if (aHas !== bHas) {
        return bHas - aHas;
      }

      return String(b.clock_in || "")
        .localeCompare(
          String(a.clock_in || "")
        );
    })[0];
}


function dedupeAttendanceRecords(records) {

  const map = new Map();

  for (const record of records || []) {

    const key =
      `${record.employee_id}_${record.work_date}`;

    const existing =
      map.get(key);

    if (!existing) {

      map.set(key,record);

    } else {

      map.set(
        key,
        choosePrimaryAttendanceRecord([
          existing,
          record
        ])
      );
    }
  }

  return Array.from(map.values());
}

async function openAttendance(employeeId) {

  const employee =

async function refreshAttendanceModal() {

  if (!currentAttendanceEmployee) return;

  const today =
    getJapanDate();

  const records =
    await getAttendanceForEmployeeDate(
      currentAttendanceEmployee.id,
      today
    );

  currentAttendanceRecord =
    choosePrimaryAttendanceRecord(
      records
    );

  renderAttendanceModal();

  if (attendanceTimer) {
    clearInterval(attendanceTimer);
  }

  attendanceTimer =
    setInterval(
      renderAttendanceModal,
      1000
    );
}


function renderAttendanceModal() {

  const status =
    document.getElementById(
      "attendanceStatus"
    );

  const actions =
    document.getElementById(
      "attendanceActions"
    );

  const workTime =
    document.getElementById(
      "attendanceWorkTime"
    );


  if (!currentAttendanceRecord) {

    status.innerHTML =
      `<div class="warning-message">
        本日はまだ出勤していません。
      </div>`;

    workTime.textContent = "";

    actions.innerHTML =
      `<button
        type="button"
        class="btn btn-success full"
        onclick="clockIn()"
      >
        🟢 出勤
      </button>`;

    return;
  }


  if (
    currentAttendanceRecord.clock_in &&
    !currentAttendanceRecord.clock_out
  ) {

    const minutes =
      calculateMinutes(
        currentAttendanceRecord.clock_in,
        new Date().toISOString(),
        0
      );

    status.innerHTML =
      `<div class="success-message">
        出勤中<br>
        出勤時刻：
        ${formatTime(currentAttendanceRecord.clock_in)}
      </div>`;

    workTime.textContent =
      `現在の実働時間：約 ${minutesToText(minutes)}`;

    actions.innerHTML =
      `<button
        type="button"
        class="btn btn-danger full"
        onclick="clockOut()"
      >
        🔴 退勤
      </button>`;

    return;
  }


  if (
    currentAttendanceRecord.clock_in &&
    currentAttendanceRecord.clock_out
  ) {

    const minutes =
      calculateMinutes(
        currentAttendanceRecord.clock_in,
        currentAttendanceRecord.clock_out,
        currentAttendanceRecord.break_minutes
      );

    status.innerHTML =
      `<div class="success-message">
        本日の勤務は終了しています。<br>
        出勤：
        ${formatTime(currentAttendanceRecord.clock_in)}
        ／ 退勤：
        ${formatTime(currentAttendanceRecord.clock_out)}<br>
        休憩：
        ${currentAttendanceRecord.break_minutes || 0}分
      </div>`;

    workTime.textContent =
      `実働時間：${minutesToText(minutes)}`;

    actions.innerHTML =
      `<button
        type="button"
        class="btn btn-secondary full"
        onclick="closeAttendanceModal()"
      >
        閉じる
      </button>`;
  }
}


async function clockIn() {

  if (!currentAttendanceEmployee) return;

  try {

    const today =
      getJapanDate();

    const existing =
      await getAttendanceForEmployeeDate(
        currentAttendanceEmployee.id,
        today
      );

    const record =
      choosePrimaryAttendanceRecord(
        existing
      );

    const now =
      new Date().toISOString();


    if (record) {

      await supabaseRequest(
        "attendance",
        "PATCH",
        `?id=eq.${encodeURIComponent(record.id)}`,
        {
          clock_in: now,
          clock_out: null,
          break_minutes: 0
        }
      );

    } else {

      await supabaseRequest(
        "attendance",
        "POST",
        "",
        {
          employee_id:
            currentAttendanceEmployee.id,

          work_date:
            today,

          clock_in:
            now,

          clock_out:
            null,

          break_minutes:
            0
        }
      );
    }

    await refreshAttendanceModal();

  } catch(error) {

    alert(
      "出勤登録に失敗しました。\n" +
      error.message
    );
  }
}


async function clockOut() {

  if (!currentAttendanceRecord) return;

  const input =
    prompt(
      "休憩時間を入力してください（分）",
      currentAttendanceRecord.break_minutes || 0
    );

  if (input === null) return;

  const breakMinutes =
    Number(input);

  if (
    !Number.isFinite(breakMinutes) ||
    breakMinutes < 0
  ) {

    alert("休憩時間を正しく入力してください。");
    return;
  }


  try {

    await supabaseRequest(
      "attendance",
      "PATCH",
      `?id=eq.${encodeURIComponent(currentAttendanceRecord.id)}`,
      {
        clock_out:
          new Date().toISOString(),

        break_minutes:
          breakMinutes
      }
    );

    await refreshAttendanceModal();

  } catch(error) {

    alert(
      "退勤登録に失敗しました。\n" +
      error.message
    );
  }
}

function changeManagerDate(days) {

  const parts =
    managerSelectedDate.split("-");

  let year =
    Number(parts[0]);

  let month =
    Number(parts[1]);

  let day =
    Number(parts[2]);

  const date =
    new Date(
      Date.UTC(
        year,
        month - 1,
        day
      )
    );

  date.setUTCDate(
    date.getUTCDate() + days
  );

  managerSelectedDate =
    `${date.getUTCFullYear()}-` +
    `${String(date.getUTCMonth()+1).padStart(2,"0")}-` +
    `${String(date.getUTCDate()).padStart(2,"0")}`;

  document.getElementById(
    "managerDate"
  ).value =
    managerSelectedDate;

  loadDailyAttendance();
}

async function loadDailyAttendance() {

  const container =
    document.getElementById(
      "dailyAttendance"
    );

  container.innerHTML =
    `<div class="loading">読み込み中...</div>`;


  try {

    const records =
      await supabaseRequest(
        "attendance",
        "GET",
        `?select=*&work_date=eq.${encodeURIComponent(managerSelectedDate)}`
      );

    const deduped =
      dedupeAttendanceRecords(records);

    const activeEmployees =
      employees.filter(
        e => e.active !== false
      );


    if (!activeEmployees.length) {

      container.innerHTML =
        `<div class="warning-message">
          アクティブなスタッフがいません。
        </div>`;

      return;
    }


    container.innerHTML =
      activeEmployees.map(employee => {

        const record =
          deduped.find(
            r =>
              r.employee_id === employee.id
          );


        let info =
          "勤務データなし";


        if (
          record &&
          record.clock_in &&
          record.clock_out
        ) {

          const minutes =
            calculateMinutes(
              record.clock_in,
              record.clock_out,
              record.break_minutes
            );

          info =
            `出勤 ${formatTime(record.clock_in)}
            　退勤 ${formatTime(record.clock_out)}
            　休憩 ${record.break_minutes || 0}分
            　実働 ${minutesToText(minutes)}`;

        } else if (
          record &&
          record.clock_in
        ) {

          info =
            `出勤 ${formatTime(record.clock_in)}
            　<span class="incomplete">出勤中</span>`;
        }


        return `

          <div class="attendance-row">

            <div class="attendance-name">
              ${escapeHtml(employee.name)}
            </div>

            <div class="attendance-info">
              ${info}
            </div>

            <div class="row-buttons">

              ${
                record

                ?

                `
                <button
                  type="button"
                  class="btn btn-primary btn-small"
                  onclick="openEdit('${record.id}')"
                >
                  編集
                </button>

                <button
                  type="button"
                  class="btn btn-warning btn-small"
                  onclick="resetAttendance('${record.id}')"
                >
                  0時間にリセット
                </button>
                `

                :

                `
                <button
                  type="button"
                  class="btn btn-secondary btn-small"
                  onclick="openNewAttendance('${employee.id}')"
                >
                  勤務データ入力
                </button>
                `
              }

            </div>

          </div>
        `;

      }).join("");

  } catch(error) {

    container.innerHTML =
      `<div class="error-message">
        ${escapeHtml(error.message)}
      </div>`;
  }
}

async function addEmployee() {

  const name =
    document.getElementById(
      "newStaffName"
    ).value.trim();

  const rate =
    Number(
      document.getElementById(
        "newStaffRate"
      ).value
    );


  if (!name) {

    alert(
      "スタッフ名を入力してください。"
    );

    return;
  }


  if (
    !Number.isFinite(rate) ||
    rate < 0
  ) {

    alert(
      "時給を正しく入力してください。"
    );

    return;
  }


  try {

    const codes =
      employees
        .map(e => e.employee_code)
        .filter(Boolean);


    let n = 1;
    let code;


    do {

      code =
        `EMP${String(n).padStart(3,"0")}`;

      n++;

    } while (
      codes.includes(code)
    );


    await supabaseRequest(
      "employees",
      "POST",
      "",
      {
        name: name,
        active: true,
        employee_code: code,
        hourly_rate: rate
      }
    );


    document.getElementById(
      "newStaffName"
    ).value = "";

    document.getElementById(
      "newStaffRate"
    ).value = "";


    await loadEmployees();

    alert(
      "スタッフを追加しました。"
    );

  } catch(error) {

    alert(
      "スタッフ追加に失敗しました。\n" +
      error.message
    );
  }
}

async function deactivateEmployee(employeeId) {

  const employee =
    employees.find(
      e => e.id === employeeId
    );

  if (!employee) return;


  if (
    !confirm(
      `${employee.name} さんを無効化しますか？\n\n` +
      "過去の勤務履歴は残ります。"
    )
  ) {
    return;

  loadStaffHistory();
}


function closeHistoryModal() {

  document

    .classList.add("hidden");

  historyEmployeeId = null;
}


function changeHistoryMonth(direction) {

  const parts =
    historyMonth.split("-");

  let year =
    Number(parts[0]);

  let month =
    Number(parts[1]);

  month += direction;


  if (month > 12) {
    month = 1;
    year++;
  }


  if (month < 1) {
    month = 12;
    year--;
  }


  historyMonth =
    `${year}-${String(month).padStart(2,"0")}`;


  document.getElementById(
    "historyMonth"
  ).value =
    historyMonth;


  loadStaffHistory();
}


function getNextMonth(month) {

  const [year,monthNumber] =
    month.split("-").map(Number);

  let y = year;

  let m =
    monthNumber + 1;

  if (m > 12) {

    m = 1;
    y++;
  }

  return `${y}-${String(m).padStart(2,"0")}`;
}


async function loadStaffHistory() {

  if (!historyEmployeeId) return;


  const container =
    document.getElementById(
      "staffHistoryContent"
    );


  container.innerHTML =
    `<div class="loading">
      読み込み中...
    </div>`;


  try {

    const nextMonth =
      getNextMonth(historyMonth);


    const records =
      await supabaseRequest(
        "attendance",
        "GET",
        `?select=*&employee_id=eq.${encodeURIComponent(historyEmployeeId)}&work_date=gte.${encodeURIComponent(historyMonth+"-01")}&work_date=lt.${encodeURIComponent(nextMonth+"-01")}&order=work_date.desc`
      );


    const deduped =
      dedupeAttendanceRecords(
        records
      );


    const employee =
      employees.find(
        e =>
          e.id === historyEmployeeId
      );


    const rate =
      Number(
        employee?.hourly_rate || 0
      );


    let totalMinutes = 0;
    let totalPay = 0;
    let completedDays = 0;
    let incompleteDays = 0;


    let html = "";


    if (!deduped.length) {

      html =
        `<div class="warning-message">
          この月の勤務データはありません。
        </div>`;

    } else {

      html = `

        <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>日付</th>
              <th>出勤</th>
              <th>退勤</th>
              <th>休憩</th>
              <th>実働</th>
              <th>概算給与</th>
              <th>操作</th>
            </tr>

          </thead>

          <tbody>
      `;


      deduped.forEach(record => {

        const complete =
          record.clock_in &&
          record.clock_out;


        let minutes = 0;
        let pay = 0;


        if (complete) {

          minutes =
            calculateMinutes(
              record.clock_in,
              record.clock_out,
              record.break_minutes
            );

          pay =
            minutes / 60 * rate;

          totalMinutes +=
            minutes;

          totalPay +=
            pay;

          completedDays++;

        } else {

          incompleteDays++;
        }


        html += `

          <tr>

            <td>
              ${formatDate(record.work_date)}
            </td>

            <td>
              ${formatTime(record.clock_in)}
            </td>

            <td>
              ${
                record.clock_out
                ? formatTime(record.clock_out)
                : '<span class="incomplete">未退勤</span>'
              }
            </td>

            <td>
              ${record.break_minutes || 0}分
            </td>

            <td>
              ${
                complete
                ? minutesToText(minutes)
                : '<span class="incomplete">未完了</span>'
              }
            </td>

            <td>
              ${
                complete
                ? "¥" + Math.round(pay).toLocaleString()
                : "-"
              }
            </td>

            <td>

              <div class="row-buttons">

                <button
                  type="button"
                  class="btn btn-primary btn-small"
                  onclick="openHistoryEdit('${record.id}')"
                >
                  編集
                </button>

                <button
                  type="button"
                  class="btn btn-danger btn-small"
                  onclick="deleteHistoryShift('${record.employee_id}','${record.work_date}')"
                >
                  削除
                </button>

              </div>

            </td>

          </tr>
        `;
      });


      html += `
          </tbody>

        </table>

        </div>
      `;
    }


    html += `

      <div class="total-box">

        <div>
          勤務日数：
          <strong>${completedDays}日</strong>
        </div>

        ${
          incompleteDays
          ?
          `
          <div class="incomplete">
            未完了勤務：
            ${incompleteDays}件
          </div>
          `
          :
          ""
        }

        <div>
          総実働時間：
          <strong>
            ${minutesToText(totalMinutes)}
          </strong>
        </div>

        <div>
          時給：
          <strong>
            ¥${rate.toLocaleString()}
          </strong>
        </div>

        <div style="margin-top:8px;">
          概算給与：
          <span class="total-number">
            ¥${Math.round(totalPay).toLocaleString()}
          </span>
        </div>

      </div>
    `;


    container.innerHTML =
      html;

  } catch(error) {

    container.innerHTML =
      `<div class="error-message">
        勤務履歴を読み込めませんでした。<br>
        ${escapeHtml(error.message)}
      </div>`;
  }
}

/* =====================================================
   DELETE HISTORY
===================================================== */

async function deleteHistoryShift(
  employeeId,
  workDate
) {

  const employee =
    employees.find(
      e =>
        e.id === employeeId
    );


  const name =
    employee?.name ||
    "このスタッフ";


  if (
    !confirm(
      `${name} さんの ${formatDate(workDate)} の勤務データを削除しますか？\n\n` +
      "この操作は元に戻せません。"
    )
  ) {
    return;
  }


  try {

    const before =
      await getAttendanceForEmployeeDate(
        employeeId,
        workDate
      );


    if (!before.length) {

      alert(
        "削除対象が見つかりません。"
      );

      return;
    }


    await supabaseRequest(
      "attendance",
      "DELETE",
      `?employee_id=eq.${encodeURIComponent(employeeId)}&work_date=eq.${encodeURIComponent(workDate)}`
    );


    const after =
      await getAttendanceForEmployeeDate(
        employeeId,
        workDate
      );


    if (after.length > 0) {

      throw new Error(
        "削除できませんでした。\n" +
        "SupabaseのDELETE権限（RLS）を確認してください。"
      );
    }


    await loadStaffHistory();

    await loadDailyAttendance();

    alert(
      "勤務データを削除しました。"
    );

  } catch(error) {

    alert(
      "削除に失敗しました。\n\n" +
      error.message
    );
  }
}

async function saveBulkEntry() {

  const rows =
    document.querySelectorAll(
      "[data-bulk-employee]"
    );


  try {

    for (const row of rows) {

      const employeeId =
        row.dataset.bulkEmployee;

      let recordId =
        row.dataset.bulkRecord;


      const clockIn =
        row.querySelector(
          ".bulk-clock-in"
        ).value;

      const clockOut =
        row.querySelector(
          ".bulk-clock-out"
        ).value;

      const breakMinutes =
        Number(
          row.querySelector(
            ".bulk-break"
          ).value || 0
        );


      if (!recordId) {

        const existing =
          await getAttendanceForEmployeeDate(
            employeeId,
            managerSelectedDate
          );

        const primary =
          choosePrimaryAttendanceRecord(
            existing
          );

        if (primary) {
          recordId = primary.id;
        }
      }


      const data = {

        employee_id:
          employeeId,

        work_date:
          managerSelectedDate,

        clock_in:
          localDateTimeToISO(clockIn),

        clock_out:
          localDateTimeToISO(clockOut),

        break_minutes:
          breakMinutes
      };


      if (recordId) {

        await supabaseRequest(
          "attendance",
          "PATCH",
          `?id=eq.${encodeURIComponent(recordId)}`,
          data
        );

      } else {

        if (!clockIn && !clockOut) {
          continue;
        }

        await supabaseRequest(
          "attendance",
          "POST",
          "",
          data
        );
      }
    }


    closeBulkEntry();

    await loadDailyAttendance();

  } catch(error) {

    alert(
      "一括保存に失敗しました。\n" +
      error.message
    );
  }
}

/* =====================================================
   CSV
===================================================== */

function csvEscape(value) {

  const s =
    String(value ?? "");

  if (
    s.includes(",") ||
    s.includes('"') ||
    s.includes("\n")
  ) {

    return `"${s.replace(/"/g,'""')}"`;
  }

  return s;
}


function downloadCSV(
  filename,
  rows
) {

  const csv =
    rows
      .map(
        row =>
          row.map(csvEscape).join(",")
      )
      .join("\r\n");


  const blob =
    new Blob(
      ["\uFEFF" + csv],
      {
        type:
          "text/csv;charset=utf-8;"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const a =
    document.createElement("a");

  a.href = url;
  a.download = filename;

  document.body.appendChild(a);

  a.click();

  a.remove();

  URL.revokeObjectURL(url);
}


async function exportDailyCSV() {

    const records =
      await supabaseRequest(
        "attendance",
        "GET",

      const minutes =

        )
        :
        0;


      const pay =
